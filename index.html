        const context = canvas.getContext('2d'); context.imageSmoothingEnabled = true; context.imageSmoothingQuality = 'high';
        context.drawImage(img, 0, 0, limited.w, limited.h);
        let fileSize=source instanceof Blob ? source.size : null;
        if(typeof source==='string' && source.startsWith('data:')){
          const comma=source.indexOf(','),payload=decodeURIComponent(source.slice(comma+1));
          fileSize=source.slice(0,comma).includes(';base64') ? atob(payload).length : new TextEncoder().encode(payload).length;
        }
        const origin = context.getImageData(0, 0, limited.w, limited.h); cleanup(); resolve({origin, canvas, fileSize});
      } catch(error){ cleanup(); reject(error); }
    };
    img.onerror = () => { cleanup(); reject(new ProjectArchiveError('projectArchiveInvalid')); };
    img.src = objectUrl || source;
  });
}
function applyImportedProject(project){
  // 区域数据先校验，失败时原图、参数与当前选区均不变。
  const regions=validateRegions(project.regions,project.image.origin);
  // 图片和全部参数已在此之前完成校验，以下一次性替换当前工程状态。
  state.origin = project.image.origin; state.originCanvas = project.image.canvas;
  state.imageFileSize = project.image.fileSize ?? null;
  state.fullResGeneration = -1; state._roCache = null;
  imageProcessor.cachedSource = null; imageProcessor.cachedParams = null; imageProcessor.cached = null;
  edgeSharpener.reset();
  resetRegions();
  regionState.items=regions;regionState.nextId=regions.reduce((max,item)=>Math.max(max,item.id+1),1);
  touchRegionMasks();
  restoreControls(project.controls || {});
  applyExperimentalSettings(project.experimental);
  restoreLightStrips(project.ledStrips);
  setExportControlsEnabled(true); syncImportDrawingButton(); syncPreviewImageMeta(); refreshRegionUI(); updateProcess();
}
function archiveImageEntry(files, imageFileName){
  const requested = String(imageFileName || '').toLowerCase();
  if(requested && files.has(requested)){
    const requestedEntry = files.get(requested);
    if(PROJECT_ARCHIVE_IMAGE_EXTENSIONS.has(requestedEntry.name.split('.').pop().toLowerCase())) return requestedEntry;
  }
  for(const entry of files.values()){
    const extension = entry.name.split('.').pop().toLowerCase();
    if(PROJECT_ARCHIVE_IMAGE_EXTENSIONS.has(extension)) return entry;
  }
  throw new ProjectArchiveError('projectArchiveInvalid');
}
async function importNativeProjectFile(file){
  const files = await readProjectZip(new Uint8Array(await file.arrayBuffer()));
  const argsEntry = files.get('args.json');
  if(!argsEntry) throw new ProjectArchiveError('projectArchiveInvalid');
  let args;
  try { args = JSON.parse(new TextDecoder().decode(argsEntry.data)); } catch(error){ throw new ProjectArchiveError('projectArchiveInvalid'); }
  if(!args || typeof args !== 'object' || !args.controls || typeof args.controls !== 'object') throw new ProjectArchiveError('projectArchiveInvalid');
  const imageEntry = archiveImageEntry(files, args.imageFileName);
  const extension = imageEntry.name.split('.').pop().toLowerCase();
  const type = extension === 'jpg' ? 'image/jpeg' : `image/${extension}`;
  const image = await decodeProjectImage(new Blob([imageEntry.data], {type}));
  const portable = args.portable && typeof args.portable === 'object' ? args.portable : null;
  applyImportedProject({ image, controls:portable && portable.controls ? portable.controls : desktopControlsToPortable(args.controls),
    experimental:portable && portable.experimental ? portable.experimental : args.experimental, ledStrips:portable && Array.isArray(portable.ledStrips) ? portable.ledStrips : desktopStripsToPortable(args.ledStrips), regions:portable ? portable.regions : undefined });
}
async function importLegacyProjectFile(file){
  let root;
  try { root = JSON.parse(await file.text()); } catch(error){ throw new ProjectArchiveError('projectArchiveInvalid'); }
  if(!root || typeof root !== 'object' || !root.controls || typeof root.image !== 'string') throw new ProjectArchiveError('projectArchiveInvalid');
  const image = await decodeProjectImage(root.image);
  applyImportedProject({image, controls:root.controls, experimental:root.experimental, ledStrips:root.ledStrips, regions:root.regions});
}
async function importProjectFile(file){
  try {
    const header = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    const isArchive = file.name.toLowerCase().endsWith('.pcblg') || (header.length === 4 && header[0] === 0x50 && header[1] === 0x4b);
    if(isArchive) await importNativeProjectFile(file); else await importLegacyProjectFile(file);
    toast(t('projectImported'));
  } catch(error){
    toast(error instanceof ProjectArchiveError ? projectZipError(error) : t('projectParseFailed'));
  }
}

  });

    };

/* ---------------- 各对话框 ---------------- */
function openFilterDialog(){
  showModal(
    '<h3>' + t('filterTitle') + '</h3>' +
    '<label class="check"><input type="checkbox" id="dlgFilterOn"' + (state.prefilter.enabled?' checked':'') + '>' + t('enableGaussian') + '</label>' +
    '<div class="mrow"><label>' + t('gaussianKernel') + '</label><input type="number" id="dlgKernel" min="3" max="7" step="2" value="' + state.prefilter.kernel + '"></div>' +
    '<div class="mrow"><label>' + t('sigma') + '</label><input type="number" id="dlgSigma" min="0.1" step="0.1" value="' + state.prefilter.sigma + '"></div>' +
    '<div class="btns"><button type="button" class="btn drawing-action-btn" id="dlgFilterCancel">' + t('cancel') + '</button><button type="button" class="btn drawing-action-btn action-selected" id="dlgFilterOk">' + t('confirm') + '</button></div>'
  );
  el('#dlgFilterOk').onclick = function(){
    state.prefilter.enabled = el('#dlgFilterOn').checked;
    state.prefilter.kernel = clampOddKernelSize(parseInt(el('#dlgKernel').value, 10) || 5);
    state.prefilter.sigma = Math.max(0.001, parseFloat(el('#dlgSigma').value) || 1.1);
    closeModal(); updateProcess();
  };
  el('#dlgFilterCancel').onclick = closeModal;
}
function openDPDialog(){
  showModal(
    '<h3>' + t('dpTitle') + '</h3>' +
    '<label class="check"><input type="checkbox" id="dlgDPOn"' + (state.dp.enabled?' checked':'') + '>' + t('enableDp') + '</label>' +
    '<div class="mrow"><label>' + t('tolerance') + '</label><input type="number" id="dlgDPTol" min="0.001" step="0.1" value="' + state.dp.tolerance + '"></div>' +
    '<div class="mrow"><label>' + t('lineWidth') + '</label><input type="number" id="dlgDPLW" min="1" max="50" step="1" value="' + state.dp.lineWidth + '"></div>' +
    '<p style="color:var(--text-dim);font-size:12.5px">' + t('dpNote') + '</p>' +
    '<div class="btns"><button type="button" class="btn drawing-action-btn" id="dlgDPCancel">' + t('cancel') + '</button><button type="button" class="btn drawing-action-btn action-selected" id="dlgDPOk">' + t('confirm') + '</button></div>'
  );
  el('#dlgDPOk').onclick = function(){
    state.dp.enabled = el('#dlgDPOn').checked;
    state.dp.tolerance = Math.max(0.001, parseFloat(el('#dlgDPTol').value) || 1.0);
    state.dp.lineWidth = clamp(parseInt(el('#dlgDPLW').value, 10) || 2, 1, 50);
    closeModal();
  };
  el('#dlgDPCancel').onclick = closeModal;
}
function colorRow(nameKey, key){
  return '<div class="mrow"><label>' + t(nameKey) + '</label><input type="color" id="col_' + key + '" value="' + toHex(custom[key]) + '"></div>';
}
function toHex(c){ return '#' + [c.r,c.g,c.b].map(v => v.toString(16).padStart(2,'0')).join(''); }
function openColorDialog(){
  showModal(
    '<h3>' + t('colorTitle') + '</h3>' +
    colorRow('colorEnig', 'enig') +
    colorRow('colorOsp', 'osp') +
    colorRow('colorHasl', 'hasl') +
    colorRow('colorBare', 'bare') +
    colorRow('colorMaskBlue', 'maskBlue') +
    colorRow('colorMaskBlack', 'maskBlack') +
    colorRow('colorMaskRed', 'maskRed') +
    colorRow('colorMaskGreen', 'maskGreen') +
    colorRow('colorMaskWhite', 'maskWhite') +
    colorRow('colorMaskYellow', 'maskYellow') +
    colorRow('colorMaskPurple', 'maskPurple') +
    '<div class="btns"><button type="button" class="btn" id="dlgColorCancel">' + t('cancel') + '</button><button type="button" class="btn accent" id="dlgColorOk">' + t('confirm') + '</button></div>'
  );
  el('#dlgColorOk').onclick = function(){
    for(const k of Object.keys(DEFAULTS)){
      const hex = el('#col_' + k).value;
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      if(!isNaN(r)){ custom[k] = {r,g,b}; }
    }
    saveLocalPrefs();
    closeModal();
    if(state.origin) updateProcess();
  };
  el('#dlgColorCancel').onclick = closeModal;
}
function resetAllSettings(){
  localStorage.removeItem('pcblg_scale');
  localStorage.removeItem('pcblg_prefs');
  localStorage.removeItem('pcblg_language');
  document.body.style.zoom = 1;
  for(const [key, value] of Object.entries(DEFAULTS)) custom[key] = {...value};
  state.prefilter = { enabled:true, kernel:5, sigma:1.1 };
  state.dp = { enabled:false, tolerance:1.0, lineWidth:2 };
  state.light = { showOverlay:false, autoSense:1, radius:150, intensity:200, strips:[], pendingStart:null };
  state.gray = { ...GRAY_DEFAULTS };
  exportCompatibility.edaImportProtection = true;
  syncEdaImportProtectionMenu();
  setGroupOpen('groupLight', false, true);
  el('#chkLightOverlay').checked = false;
  setSlider('#sliderLightSense', state.light.autoSense);
  setSlider('#sliderLightRadius', state.light.radius);
  setSlider('#sliderLightIntensity', state.light.intensity);
  setSlider('#sliderTrans', 120);
  setSlider('#sliderGraySilk', state.gray.silkThreshold);
  setSlider('#sliderGrayMask', state.gray.maskThreshold);

  setSlider('#sliderGrayBlur', state.gray.blurRadius);
  el('#grayPreviewMask').value = state.gray.previewMaskId;
  // 安装版 v1.5.1 的默认边缘处理为描边；重置后同样回到该默认行为。
  el('#radioEdgeStroke').checked = true; el('#radioEdgeEnhance').checked = false;
  setProcessingMode('gray', false);
  for(const item of regionState.items)item.offsets={gray:{},color:{}};
  regionState.revision++;regionState.undo=[];regionState.redo=[];refreshRegionUI();
  if(state.origin)updateProcess();
  setLanguage('zh-CN', false);
  toast(t('resetSuccess'));
}

/* ---------------- 本地偏好 ---------------- */
function saveLocalPrefs(){
  localStorage.setItem('pcblg_prefs', JSON.stringify({ custom, prefilter:state.prefilter, dp:state.dp, edaImportProtection:exportCompatibility.edaImportProtection }));
}
function loadLocalPrefs(){
  setLanguage(localStorage.getItem('pcblg_language'), false);
  const s = localStorage.getItem('pcblg_scale');
  if(s) document.body.style.zoom = parseFloat(s) || 1;
  const p = localStorage.getItem('pcblg_prefs');
  if(p){
    try {
      const o = JSON.parse(p);
      if(o.custom){ for(const k of Object.keys(DEFAULTS)) if(o.custom[k]) custom[k] = o.custom[k]; }
      if(o.prefilter) state.prefilter = o.prefilter;
      if(o.dp) state.dp = o.dp;
      if(typeof o.edaImportProtection === 'boolean') exportCompatibility.edaImportProtection = o.edaImportProtection;
    } catch(e){}
  }
  syncEdaImportProtectionMenu();
}

/* ---------------- 初始化 ---------------- */
function init(){
  try{localStorage.removeItem('pcblg_theme');}catch(_){}
  // 创建滑块
  createSlider('sliderGold', 'goldThreshold', 0, 359, 45);
  createSlider('sliderSilk', 'silkThreshold', 0, 255, 180);
  createSlider('sliderTrans', 'transThreshold', 0, 255, 120);
  createSlider('sliderCopper', 'copperThreshold', 0, 255, 150);
  createSlider('sliderBareA', 'bareGrayMin', 0, 100, 20);
  createSlider('sliderBareB', 'bareGrayMax', 0, 100, 65);
  createSlider('sliderBareSim', 'bareSimilarity', 0, 100, 80);
  createSlider('sliderEdgeThresh', 'edgeThresholdMin', 0, 255, 50);
  createSlider('sliderEdgeThreshMax', 'edgeThresholdMax', 0, 255, 200);
  createSlider('sliderAutoInvert', 'autoInvertRange', -1, 50, 10);
  createSlider('sliderLightSense', 'autoLightSensitivity', 0, 10, state.light.autoSense, 1, v => { state.light.autoSense = v; });
  createSlider('sliderLightRadius', 'lightRadius', 20, 500, state.light.radius, 1, v => { state.light.radius = v; });
  createSlider('sliderLightIntensity', 'lightIntensity', 0, 255, state.light.intensity, 1, v => { state.light.intensity = v; });
  createSlider('sliderGraySilk', 'graySilkThreshold', 0, 255, GRAY_DEFAULTS.silkThreshold, 1, v => { state.gray.silkThreshold = v; });
  createSlider('sliderGrayMask', 'grayMaskThreshold', 0, 255, GRAY_DEFAULTS.maskThreshold, 1, v => { state.gray.maskThreshold = v; });
  createSlider('sliderGrayThick', 'grayThick', 0, 12, GRAY_DEFAULTS.thickRadius, 0.2, v => { state.gray.thickRadius = v; });
  createSlider('sliderGrayBlur', 'grayBlur', 0, 8, GRAY_DEFAULTS.blurRadius, 0.1, v => { state.gray.blurRadius = v; });

  // 折叠组标题点击
  document.querySelectorAll('.group>.group-header').forEach(h => {
    h.addEventListener('click', function(){
      const g = h.parentElement;
      const open = !g.classList.contains('open');
      setGroupOpen(g.id, open, true);
      syncEdgeUI();
      updateProcess();
    });
  });

  // 主控件变更 → 全分辨率重渲
  el('#selectFinish').addEventListener('change', function(){ syncEdgeUI(); updateProcess(); });
  el('#selectMask').addEventListener('change', updateProcess);
  el('#radioBareGray').addEventListener('change', function(){ if(this.checked) updateProcess(); });
  el('#radioBareColor').addEventListener('change', function(){ if(this.checked) updateProcess(); });
  el('#radioEdgeStroke').addEventListener('change', function(){ if(this.checked) updateProcess(); });
  el('#radioEdgeEnhance').addEventListener('change', function(){ if(this.checked) updateProcess(); });
  el('#chkUseMetal').addEventListener('change', function(){ syncEdgeUI(); updateProcess(); });
  el('#chkExposeMetal').addEventListener('change', updateProcess);
  el('#chkLightOverlay').addEventListener('change', function(){ state.light.showOverlay = this.checked; updateProcess(); });
  el('#btnAutoLights').addEventListener('click', autoSuggestLights);
  el('#grayPreviewMask').addEventListener('change', function(){ state.gray.previewMaskId = this.value; updateProcess(); });
  document.querySelectorAll('[data-processing-mode]').forEach(btn => {
    btn.addEventListener('click', function(){ setProcessingMode(this.dataset.processingMode, true); });
  });
  document.querySelectorAll('[data-view-mode]').forEach(btn => {
    btn.addEventListener('click', function(){ setViewMode(this.dataset.viewMode); });
  });

  // 预览交互
  attachPreviewInteraction('composite');
  attachPreviewInteraction('copper');
  attachPreviewInteraction('mask');
  attachPreviewInteraction('silk');
  attachPreviewInteraction('bottom');
  for(const key in quadPreviewCanvases) attachQuadPreviewInteraction(key);
  attachLightPlacement('#canvasComposite', false);

  // 文件输入
  const fi = document.createElement('input');
  fi.type = 'file'; fi.accept = 'image/*'; fi.id = 'fileInput'; fi.style.display = 'none';
  fi.addEventListener('change', function(){ if(this.files[0]) loadImageFile(this.files[0]); this.value = ''; });
  document.body.appendChild(fi);

  const pi = document.createElement('input');
  pi.type = 'file'; pi.accept = '.pcblg,.pcblg.json,.json'; pi.id = 'projInput'; pi.style.display = 'none';
  pi.addEventListener('change', function(){ if(this.files[0]) importProjectFile(this.files[0]); this.value = ''; });
  document.body.appendChild(pi);

  el('#modalBack').addEventListener('click', function(e){
    if(e.target !== this || disclaimerCleanup)return;
    e.stopImmediatePropagation();dismissModal();
  });

  initializeInterface();
  initializeRegions();
  setupMenus();
  try{ loadLocalPrefs(); }
  catch(_){ setLanguage('zh-CN', false); }
  setViewMode('overlay');
  syncEdgeUI();
  resizeCanvases();
  window.addEventListener('resize', resizeCanvases);
  if(!hasReadDisclaimer()) showDisclaimer();
}

window.addEventListener('error', function(e){ try{ toast(t('runtimeError') + (e.message || t('unknownError'))); }catch(_){} });
window.addEventListener('unhandledrejection', function(e){ try{ toast(t('runtimeError') + ((e.reason && e.reason.message) || t('unknownError'))); }catch(_){} });
