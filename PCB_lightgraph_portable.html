<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCB_lightgraph_Portable</title>
<style>
:root{
  --bg:#1b1b1b;
  --panel:#252525;
  --panel2:#2d2d2d;
  --border:#3a3a3a;
  --text:#e8e8e8;
  --text-dim:#9d9d9d;
  --accent:#4cc2ff;
  --accent-hover:#6fd0ff;
  --control-accent:#b9c5e8;
  --control-accent-text:#091331;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);color:var(--text);
  font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  font-size:14px;overflow:hidden;display:flex;flex-direction:column;
  user-select:none;
}
/* ---- top bar ---- */
.topbar{
  display:flex;align-items:center;gap:8px;padding:6px 12px;position:relative;
  background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto;
}
.brand{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:15px;margin-right:8px;white-space:nowrap;}
.brand-badge{display:inline-flex;align-items:center;align-self:center;border-radius:3px;background:var(--control-accent);color:var(--control-accent-text);padding:2px 5px;font-size:10px;font-weight:700;letter-spacing:.03em;line-height:1.2;transform:translateY(1px);}
.brand-badge[hidden]{display:none;}
.brand .dot{color:var(--accent);}
.brand .edition{color:var(--text-dim);font-weight:400;font-size:12.5px;}
.menubar{display:flex;gap:2px;}
.menu{position:relative;}
.menu>button{
  background:transparent;border:none;color:var(--text);padding:6px 12px;border-radius:6px;
  cursor:pointer;font-size:14px;font-family:inherit;
}
.menu>button:hover,.menu:focus-within>button{background:var(--panel2);}
.star-link{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:transparent;border:none;padding:6px 10px;border-radius:10px;
  cursor:pointer;font:inherit;font-size:12.5px;font-weight:700;white-space:nowrap;
  animation:star-rainbow 3s linear infinite;transition:background 220ms ease;
}
/* 三类操作控件共用描边与扫光；仅模式按钮额外保留过渡和选中态。 */
.star-link::before,.drawing-action-btn::before,.mode-switch button::before,.paint-tool::before{position:absolute;inset:-1px;border:2px solid #f8fcff;border-radius:13px;box-shadow:0 0 3px rgb(237 248 255 / 88%);content:"";opacity:0;pointer-events:none;transform:scale(.98);}
.star-link::after,.drawing-action-btn::after,.mode-switch button::after,.paint-tool::after{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,transparent 42%,rgb(255 255 255 / 0%) 46%,rgb(255 255 255 / 55%) 50%,rgb(220 244 255 / 18%) 54%,transparent 58%);background-position:-130% -130%;background-size:260% 260%;content:"";opacity:0;pointer-events:none;}
@media (hover:hover){
  .star-link.is-hovered{background:rgba(76,194,255,.15);}
  .star-link.is-hovered::before,.drawing-action-btn:not(:disabled).is-hovered::before,.mode-switch button:not(.active).is-hovered::before,.paint-tool:not(.active).is-hovered::before{animation:mode-switch-rim-enter 150ms linear both;}
  .star-link.is-hovered::after,.drawing-action-btn:not(:disabled).is-hovered::after,.mode-switch button:not(.active).is-hovered::after,.paint-tool:not(.active).is-hovered::after{animation:mode-switch-shine 380ms ease-out both;}
  .star-link.is-leaving::before,.drawing-action-btn:not(:disabled).is-leaving::before,.mode-switch button.is-leaving::before,.paint-tool.is-leaving::before{animation:mode-switch-rim-leave 150ms linear both;}
}
.star-link:focus-visible{background:rgba(76,194,255,.15);outline:none;}
.star-link:focus-visible::before,.drawing-action-btn:focus-visible:not(:disabled)::before,.mode-switch button:focus-visible:not(.active)::before,.paint-tool:focus-visible:not(.active)::before{inset:-4px;border-width:4px;border-color:rgb(239 247 255 / 90%);box-shadow:0 0 8px 1px rgb(203 230 255 / 62%);opacity:.9;transform:scale(1);}
@keyframes star-rainbow{from{color:#ff758f;}20%{color:#ffbc4b;}40%{color:#8ad45b;}60%{color:#55c7ff;}80%{color:#b38cff;}to{color:#ff758f;}}
/* 窄窗口让 Star 提示独占下一行，避免与菜单的可点击区域重叠。 */
@media (max-width:1120px){
  .topbar{flex-wrap:wrap;}
  .menubar{flex-wrap:wrap;}
  .star-link{position:static;transform:none;order:3;flex:0 0 100%;text-align:center;}
}
.dropdown{
  display:none;position:absolute;top:100%;left:0;min-width:200px;z-index:100;
  background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:4px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.menu:hover > .dropdown,.menu:focus-within > .dropdown{display:block;}
.dropdown button{
  display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);
  padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13.5px;font-family:inherit;
}
.dropdown button:hover{background:rgba(76,194,255,.15);}
.dropdown button.active::after{content:'✓';float:right;color:var(--accent);}
.dropdown button.disabled,.dropdown button:disabled{color:#666;cursor:not-allowed;}
.dropdown button:disabled:hover{background:transparent;}
.dropdown .sep{height:1px;background:var(--border);margin:4px 6px;}
.submenu{position:relative;}
.submenu>.dropdown{left:100%;top:0;}
.submenu:hover>.dropdown,.submenu:focus-within>.dropdown{display:block;}
/* ---- main ---- */
.main{flex:1 1 auto;display:flex;min-height:0;}
.col-preview{flex:4 4 0;display:flex;flex-direction:column;padding:10px;min-width:0;gap:6px;}
.hint{color:var(--text-dim);font-size:12.5px;flex:0 0 auto;}
.preview-wrap{
  flex:1 1 auto;min-height:0;position:relative;background:#232323;
  border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;
}
.preview-wrap canvas{display:block;width:100%;height:100%;}
.preview-wrap .placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);pointer-events:none;font-size:14px;
}
.preview-image-meta{flex:0 0 auto;text-align:center;color:var(--text-dim);font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preview-stage{flex:1 1 auto;min-height:0;display:flex;}
.preview-stage>.preview-wrap{width:100%;}
.quad-grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;}
/* display:grid 会覆盖浏览器的 hidden 默认样式，必须显式隐藏非四分视图。 */
.quad-grid[hidden]{display:none;}
.quad-cell{display:flex;flex-direction:column;min-width:0;min-height:0;}
.quad-cell .t{color:var(--text-dim);font-size:12px;margin-bottom:4px;flex:0 0 auto;}
.quad-cell .w{flex:1 1 auto;min-height:0;position:relative;background:#232323;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.quad-cell canvas{display:block;width:100%;height:100%;}
.quad-cell .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);pointer-events:none;font-size:13px;}
.col-controls{flex:1.1 1 0;min-width:280px;max-width:420px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;padding:10px;border-left:1px solid var(--border);border-right:1px solid var(--border);}
/* 隐藏滚动条但保留滚轮滚动，避免过长设置被裁切。 */
.col-controls::-webkit-scrollbar{width:0;height:0;}
.col-layers{flex:3 3 0;overflow:hidden;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;}
/* groups */
.group{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;
}
.group>.group-header{
  padding:9px 12px;cursor:pointer;font-weight:600;font-size:13.5px;
  display:flex;align-items:center;gap:8px;background:transparent;border:none;width:100%;text-align:left;
  color:var(--text);font-family:inherit;
}
.group>.group-header:hover{background:var(--panel2);}
.group>.group-header .chev{transition:transform .18s cubic-bezier(.33,1,.68,1);font-size:11px;color:var(--text-dim);}
.group.open>.group-header .chev{transform:rotate(90deg);}
.group .content{max-height:0;overflow:hidden;transition:max-height .18s cubic-bezier(.33,1,.68,1);}
.group.open .content{max-height:1200px;}
.group .inner{padding:4px 12px 12px;}
/* controls */
label.ctl{display:block;margin:9px 0;font-size:13px;}
label.ctl .lab{display:block;color:var(--text-dim);font-size:12.5px;margin-bottom:4px;}
select{
  width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit;outline:none;
}
/* 操作区控件共用模式选中态配色，预览画布仍保留独立的蓝色提示。 */
select:focus{border-color:var(--control-accent);}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;
  background:var(--panel2);outline:none;border:1px solid var(--border);cursor:grab;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--control-accent);cursor:grab;border:none;
}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--control-accent);cursor:grab;border:none;}
/* 按住滑杆期间与画布拖动一致，显示正在抓取的光标。 */
input[type=range]:not(:disabled):active,input[type=range]:not(:disabled):active::-webkit-slider-thumb,input[type=range]:not(:disabled):active::-moz-range-thumb{cursor:grabbing;}
input[type=range]:disabled,input[type=range]:disabled::-webkit-slider-thumb,input[type=range]:disabled::-moz-range-thumb{opacity:.4;cursor:not-allowed;}
.check,.radio{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;cursor:pointer;}
.check input,.radio input{accent-color:var(--control-accent);width:16px;height:16px;cursor:pointer;}
button.btn{
  background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;
  padding:8px 12px;cursor:pointer;font-size:13px;font-family:inherit;margin:3px 2px;
}
button.btn:hover{border-color:var(--control-accent);}
button.btn.accent{background:var(--control-accent);color:var(--control-accent-text);border-color:var(--control-accent);font-weight:600;}
button.btn.accent:hover{background:var(--control-accent);}
button.btn:disabled{opacity:.4;cursor:not-allowed;}
/* 图纸操作继承上方共用描边和扫光；禁用按钮不参与交互动画。 */
button.drawing-action-btn{position:relative;border-radius:10px;transition:color 220ms ease,background 220ms ease,border-color 220ms ease;}
/* 导出动作沿用模式切换的选中态配色，导入动作仍保持普通按钮层级。 */
button.drawing-action-btn.action-selected{background:var(--control-accent);color:var(--control-accent-text);border-color:var(--control-accent);font-weight:600;}
button.drawing-action-btn.action-selected:hover{background:var(--control-accent);}
.drawing-action-btn:focus-visible:not(:disabled){outline:none;}
.btn-row{display:flex;gap:6px;}
.btn-row.centered{justify-content:center;}
.flex-fill{flex:1;}
.note{margin:9px 0 0;color:var(--text-dim);font-size:12px;line-height:1.5;}
/* 分层算法切换：仅展示当前算法所需的参数，避免误以为隐藏控件仍会生效。 */
.mode-switch{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:4px;margin-bottom:10px;}
.mode-switch button{position:relative;flex:1;background:transparent;border:0;border-radius:10px;color:var(--text-dim);padding:7px 6px;cursor:pointer;font:inherit;font-size:12.5px;transition:color 220ms ease,background 220ms ease;}
/* 同一条描边先以细亮线出现，再向外扩为较暗的宽边；伪元素不会改变模式按钮布局。 */
.mode-switch button::before{transition:opacity 180ms ease,inset 260ms cubic-bezier(.22,.61,.36,1),border-width 260ms cubic-bezier(.22,.61,.36,1),border-color 230ms ease,box-shadow 230ms ease,transform 260ms cubic-bezier(.22,.61,.36,1);}
/* 扫光限制在按钮表面，避免裁切负责外扩描边的 ::before。 */
@media (hover:hover){.mode-switch button:not(.active).is-hovered{color:var(--text);background:rgb(76 194 255 / 12%);}}
/* 进入与退出均让宽度、颜色和透明度同步变化，避免边框突然亮起或出现阶段分界。 */
@keyframes mode-switch-shine{
  0%{background-position:-130% -130%;opacity:0;}
  10%{opacity:1;}
  88%{opacity:.9;}
  100%{background-position:130% 130%;opacity:0;}
}
@keyframes mode-switch-rim-enter{
  0%{inset:-1px;border-width:2px;border-color:#f8fcff;box-shadow:0 0 3px rgb(237 248 255 / 88%);opacity:0;transform:scale(.98);}
  100%{inset:-4px;border-width:4px;border-color:rgb(239 247 255 / 90%);box-shadow:0 0 8px 1px rgb(203 230 255 / 62%);opacity:.9;transform:scale(1);}
}
@keyframes mode-switch-rim-leave{
  0%{inset:-4px;border-width:4px;border-color:rgb(239 247 255 / 90%);box-shadow:0 0 8px 1px rgb(203 230 255 / 62%);opacity:.9;transform:scale(1);}
  100%{inset:-1px;border-width:2px;border-color:#f8fcff;box-shadow:0 0 3px rgb(237 248 255 / 88%);opacity:0;transform:scale(.98);}
}
.mode-switch button:focus-visible:not(.active){color:var(--text);background:rgb(76 194 255 / 12%);outline:none;}
/* 当前算法的 active 状态由 setProcessingMode 统一维护，优先于悬停描边。 */
.mode-switch button.active{background:var(--control-accent);color:var(--control-accent-text);}
.mode-switch button.active::before{opacity:0;}
.mode-switch button.is-switching-in,.paint-tool.is-switching-in{animation:mode-switch-selected-enter 220ms ease both;}
.mode-switch button.is-switching-out,.paint-tool.is-switching-out{pointer-events:none;animation:mode-switch-selected-leave 220ms ease both;}
@keyframes mode-switch-selected-enter{from{background:rgb(185 197 232 / 0%);color:var(--text-dim);}to{background:var(--control-accent);color:var(--control-accent-text);}}
@keyframes mode-switch-selected-leave{from{background:var(--control-accent);color:var(--control-accent-text);}to{background:rgb(185 197 232 / 0%);color:var(--text-dim);}}
@media (prefers-reduced-motion:reduce){.mode-switch button,.mode-switch button::before,.paint-tool,.paint-tool::before,.drawing-action-btn,.drawing-action-btn::before{transition-duration:0ms;transition-delay:0ms;}}
.mode-specific[hidden]{display:none;}
/* layer previews grid */
.layers-grid{
  flex:1 1 auto;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));grid-template-rows:repeat(2, minmax(0, 1fr));gap:8px;min-height:0;
}
/* 两种算法共用 2×2 预览格；灰度模式的第四格明确标为无输出。 */
.layers-grid .lp[hidden]{display:none;}
.layers-grid .lp{display:flex;flex-direction:column;min-width:0;min-height:0;}
.layers-grid .lp .t{color:var(--text-dim);font-size:12px;margin-bottom:4px;flex:0 0 auto;}
.layers-grid .lp .w{
  flex:1 1 auto;min-height:0;background:#1e1e1e;border:1px dashed #3a3a3a;border-radius:8px;
  overflow:hidden;position:relative;
}
.layers-grid .lp canvas{display:block;width:100%;height:100%;}
/* modal */
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200;
}
.modal-back.show{display:flex;}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;
  min-width:320px;max-width:520px;box-shadow:0 12px 40px rgba(0,0,0,.6);max-height:86vh;overflow:auto;
}
.modal h3{margin:0 0 12px;font-size:16px;}
.modal .mrow{margin:10px 0;display:flex;align-items:center;gap:10px;}
.modal .mrow label{flex:0 0 180px;font-size:13px;color:var(--text-dim);}
.modal input[type=number]{width:90px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;}
.modal input[type=color]{width:46px;height:30px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);padding:1px;}
.modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
/* 内置画板直接编辑原图像素；显示尺寸仅用于适配窗口，不改变源图分辨率。 */
.paint-modal{width:min(1120px,94vw);max-width:1120px;height:min(88vh,820px);display:flex;flex-direction:column;overflow:hidden;}
.paint-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.paint-toolbar label{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12.5px;}
.paint-toolbar input[type=color]{width:34px;height:28px;}
.paint-toolbar input[type=range]{width:120px;}
.paint-tool-switch{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:4px;}
/* 画笔和橡皮擦直接沿用主页模式切换的外观与动画，不叠加普通按钮边框。 */
.paint-tool{position:relative;background:transparent;border:0;border-radius:10px;color:var(--text-dim);padding:7px 12px;cursor:pointer;font:inherit;font-size:12.5px;transition:color 220ms ease,background 220ms ease;}
.paint-tool::before{transition:opacity 180ms ease,inset 260ms cubic-bezier(.22,.61,.36,1),border-width 260ms cubic-bezier(.22,.61,.36,1),border-color 230ms ease,box-shadow 230ms ease,transform 260ms cubic-bezier(.22,.61,.36,1);}
@media (hover:hover){.paint-tool:not(.active).is-hovered{color:var(--text);background:rgb(76 194 255 / 12%);}}
.paint-tool.active{background:var(--control-accent);color:var(--control-accent-text);}
.paint-tool.active::before{opacity:0;}
.paint-tool:focus-visible:not(.active){color:var(--text);background:rgb(76 194 255 / 12%);outline:none;}
#paintBrushModeWrap{flex:0 0 auto;flex-wrap:nowrap;white-space:nowrap;}
.paint-stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#171717;border:1px solid var(--border);border-radius:8px;margin-top:10px;}
.paint-stage canvas{display:block;flex:none;touch-action:none;cursor:crosshair;box-shadow:0 0 0 1px rgb(255 255 255 / 10%);will-change:transform;}
.paint-size-indicator{position:absolute;border:1.5px solid var(--control-accent);border-radius:50%;box-sizing:border-box;pointer-events:none;z-index:1;opacity:0;transition:opacity .15s ease;box-shadow:0 0 3px rgb(0 0 0 / 82%);}
.paint-size-indicator.show{opacity:1;}
.paint-image-meta{margin-left:auto;color:var(--text-dim);font-size:12px;white-space:nowrap;}
@media (max-width:680px){.paint-modal{width:98vw;height:94vh;padding:12px;}.paint-toolbar{gap:5px;}.paint-toolbar input[type=range]{width:86px;}}
/* 裁剪画布按图片实际比例绘制，坐标直接映射回原图，避免预览缩放带来裁切偏差。 */
.crop-modal{width:min(900px,calc(100vw - 32px));max-width:none;height:min(82vh,720px);max-height:calc(100vh - 32px);overflow:hidden;}
.crop-modal>div{display:flex;flex-direction:column;min-height:0;height:100%;}
.crop-hint{margin:0 0 12px;color:var(--text-dim);font-size:12.5px;line-height:1.5;}
.crop-stage{position:relative;display:flex;align-items:center;justify-content:center;flex:1 1 auto;min-height:0;overflow:hidden;background:#171717;border:1px solid var(--border);border-radius:8px;padding:8px;}
.crop-stage canvas{display:block;flex:none;max-width:none;touch-action:none;cursor:default;will-change:transform;}
/* toast */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--border);border-radius:8px;padding:10px 18px;z-index:300;
  display:none;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.5);
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span data-i18n="brandName">PCB图片分层器</span><span class="brand-badge" id="brandBadge">便携版</span></div>
  <div class="menubar" id="menubar">
    <div class="menu" id="menuFile">
      <button type="button" data-i18n="menuFile">File</button>
      <div class="dropdown">
        <button type="button" id="mImport" data-i18n="importImage">导入图片</button>
        <button type="button" id="mExport" class="disabled" data-i18n="exportDrawing">导出全部图纸</button>
        <button type="button" id="mSave" data-i18n="saveProject">保存工程…</button>
        <button type="button" id="mLoad" data-i18n="loadProject">导入工程…</button>
      </div>
    </div>
    <div class="menu" id="menuEdit">
      <button type="button" data-i18n="menuEdit">编辑</button>
      <div class="dropdown">
        <button type="button" id="mPaint" data-i18n="liveEdit" disabled>图纸快捷编辑</button>
      </div>
    </div>
    <div class="menu" id="menuOption">
      <button type="button" data-i18n="menuOption">Option</button>
      <div class="dropdown">
        <div class="submenu" id="subEdge">
          <button type="button" data-i18n="edgeMenu">边缘处理 ▸</button>
          <div class="dropdown">

/* ---------------- 基础工具 ---------------- */
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function qGrayRgb(r,g,b){ return Math.floor((r*11 + g*16 + b*5) / 32); }
/* 注意：必须返回真正的 ImageData，putImageData / canvas 要求其类型 */
function makeImg(w,h){ return new ImageData(w, h); }
function cloneImg(img){ return new ImageData(new Uint8ClampedArray(img.data), img.width, img.height); }
const canvasOf = new WeakMap();
function toCanvas(img){
  let c = canvasOf.get(img);
  if(!c){
    c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    c.getContext('2d').putImageData(img, 0, 0); canvasOf.set(img, c);
  }
  return c;
}
function scaleImageData(img, w, h){
  const c = toCanvas(img);
  const oc = document.createElement('canvas'); oc.width = w; oc.height = h;
  const ctx = oc.getContext('2d');

/* RGB <-> HSV，遵循 Qt QColor 语义（hue 0..359，-1 表示无彩色；s/v 0..255，整数运算） */
function rgbToHsv(r,g,b){
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  const v = max, delta = max - min;
  let s = (v === 0) ? 0 : Math.trunc(255 * delta / v);
  let h = -1;
  if(delta !== 0){
    let hh;
    if(max === r) hh = Math.trunc(60 * (g - b) / delta);
    else if(max === g) hh = Math.trunc(60 * (b - r) / delta) + 120;
    else hh = Math.trunc(60 * (r - g) / delta) + 240;
    if(hh < 0) hh += 360;
    h = hh;
  }
  return { h, s, v };
}
function hsvToRgb(h, s, v){
  if(s <= 0 || h < 0) return { r:v, g:v, b:v };
  const sf = s/255, vf = v/255;
  const c = vf * sf;
  const hp = (h % 360) / 60;
  const x = c * (1 - Math.abs(hp % 2 - 1));
  let r=0,g=0,b=0;
  if(hp < 1){ r=c; g=x; }
  else if(hp < 2){ r=x; g=c; }
  else if(hp < 3){ g=c; b=x; }
  else if(hp < 4){ g=x; b=c; }
  else if(hp < 5){ r=x; b=c; }
  else { r=c; b=x; }
  const m = vf - c;
  return { r:Math.round((r+m)*255), g:Math.round((g+m)*255), b:Math.round((b+m)*255) };
}

  const bw = 255 - topWeight255;

    r: Math.floor((base.r*bw + top.r*topWeight255)/255),
    g: Math.floor((base.g*bw + top.g*topWeight255)/255),
    b: Math.floor((base.b*bw + top.b*topWeight255)/255)

  const { h, s, v } = rgbToHsv(col.r, col.g, col.b);

function colorSimilarityPercent(a, b){
  const dr = a.r - b.r, dg = a.g - b.g, db = a.b - b.b;
  const dist = Math.sqrt(dr*dr + dg*dg + db*db);
  const maxDist = Math.sqrt(3*255*255);
  const sim = (1 - dist/maxDist) * 100;
  return clamp(Math.round(sim), 0, 100);

/* ---------------- 自定义色值（持久化） ---------------- */
const DEFAULTS = {
  enig:{r:240,g:217,b:140},
  osp:{r:240,g:170,b:147},
  hasl:{r:200,g:200,b:215},
  bare:{r:153,g:187,b:119}
};
const custom = { enig:{...DEFAULTS.enig}, osp:{...DEFAULTS.osp}, hasl:{...DEFAULTS.hasl}, bare:{...DEFAULTS.bare} };
function getSolderMaskColor(id){
  if(id === 'blue') return {r:0,g:50,b:150};
  if(id === 'red') return {r:150,g:0,b:0};
  if(id === 'black') return {r:10,g:10,b:10};
  if(id === 'green') return {r:0,g:100,b:50};
  return {r:240,g:240,b:240}; // white
}
function getSilkColor(maskId){
  if(maskId === 'white') return {r:20,g:20,b:20};
  return {r:255,g:255,b:255};
}
function getMetalRenderColor(finishType){
  if(finishType === 'hasl') return custom.hasl;
  if(finishType === 'osp') return custom.osp;
  return custom.enig;
}
function getBareColor(){ return custom.bare; }
function isMetal(r,g,b, finishType, goldThresh, satThresh, valThresh){
  if(satThresh === undefined) satThresh = 50;
  if(valThresh === undefined) valThresh = 70;
  const { h, s, v } = rgbToHsv(r,g,b);
  if(finishType === 'hasl'){
    const isSilver = (s < 40 || (h > 160 && h < 260));
    return isSilver && (v > goldThresh);
  }
  if(finishType === 'osp'){
    const ospHue = rgbToHsv(custom.osp.r, custom.osp.g, custom.osp.b).h;
    return (Math.abs(h - ospHue) < 25 && s > satThresh && v > valThresh);
  }
  return (Math.abs(h - goldThresh) < 25 && s > satThresh && v > valThresh);
}

/* ---------------- 高斯模糊（可分离核，3..7 奇数） ---------------- */
function clampOddKernelSize(k){
  if(k < 3) k = 3;
  if(k > 7) k = 7;
  if(k % 2 === 0) --k;
  if(k < 3) k = 3;
  return k;
}
function buildGaussian1D(kernelSize, sigma){
  kernelSize = clampOddKernelSize(kernelSize);
  sigma = Math.max(sigma, 1e-3);
  const radius = Math.floor(kernelSize/2);
  const w = new Array(kernelSize);
  const twoSigma2 = 2*sigma*sigma;
  let sum = 0;
  for(let i = -radius; i <= radius; i++){
    const v = Math.exp(-(i*i)/twoSigma2);
    w[i+radius] = v; sum += v;
  }
  for(let i = 0; i < kernelSize; i++) w[i] /= sum;
  return w;
}
function applyGaussianBlur(src, kernelSize, sigma){
  kernelSize = clampOddKernelSize(kernelSize);
  if(!src || kernelSize <= 1) return src;
  const weights = buildGaussian1D(kernelSize, sigma);
  const radius = Math.floor(kernelSize/2);
  const w = src.width, h = src.height, sd = src.data;
  const tmp = new Float32Array(w*h*4);
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      let a=0,r=0,g=0,b=0;
      for(let k = -radius; k <= radius; k++){
        const sx = clamp(x+k, 0, w-1);
        const i = (y*w + sx)*4, wt = weights[k+radius];
        a += sd[i+3]*wt; r += sd[i]*wt; g += sd[i+1]*wt; b += sd[i+2]*wt;
      }
      const o = (y*w + x)*4;
      tmp[o]=r; tmp[o+1]=g; tmp[o+2]=b; tmp[o+3]=a;
    }
  }
  const out = makeImg(w,h), od = out.data;
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      let a=0,r=0,g=0,b=0;
      for(let k = -radius; k <= radius; k++){
        const sy = clamp(y+k, 0, h-1);
        const i = (sy*w + x)*4, wt = weights[k+radius];
        a += tmp[i+3]*wt; r += tmp[i]*wt; g += tmp[i+1]*wt; b += tmp[i+2]*wt;
      }
      const o = (y*w + x)*4;
      od[o]=Math.floor(r+0.5); od[o+1]=Math.floor(g+0.5); od[o+2]=Math.floor(b+0.5); od[o+3]=Math.floor(a+0.5);
    }
  }
  return out;
}

/* ---------------- 图像分层核心 ---------------- */
class ImageProcessor {
  constructor(){ this.cachedSource = null; this.cachedParams = null; this.cached = null; }
  paramsKey(src, p){
    return [src, p.finishType, p.maskColorName, p.isWhiteMask, p.goldThresh, p.silkThresh,
      p.transThresh, p.copperDepth, p.enableBare, p.bareGrayMode, p.bareGrayMin, p.bareGrayMax, p.bareSim].join('|');
  }
  processImage(src, p, mutable){
    if(!src) return { copper:null, mask:null, silk:null, bottom:null, composite:null };
    const key = this.paramsKey(src, p);
    const makeOut = (base) => ({
      copper: mutable ? cloneImg(base.copper) : base.copper,
      mask: mutable ? cloneImg(base.mask) : base.mask,
      silk: mutable ? cloneImg(base.silk) : base.silk,
      bottom: mutable ? cloneImg(base.bottom) : base.bottom,
      composite: mutable ? cloneImg(base.composite) : base.composite
    });
    if(this.cachedSource === src && this.cachedParams === key){
      return makeOut(this.cached);
    }
    const base = this.buildBaseLayers(src, p);
    this.cachedSource = src; this.cachedParams = key; this.cached = base;
    return makeOut(base);
  }
  buildBaseLayers(src, p){
    const w = src.width, h = src.height;
    const maskColor = getSolderMaskColor(p.maskColorName);
    const silkColor = getSilkColor(p.maskColorName);
    const metalColor = getMetalRenderColor(p.finishType);
    const bareColor = getBareColor();
    const grayMinPct = clamp(Math.min(p.bareGrayMin, p.bareGrayMax), 0, 100);
    const grayMaxPct = clamp(Math.max(p.bareGrayMin, p.bareGrayMax), 0, 100);
    const simThresh = clamp(p.bareSim, 0, 100);
    const effCopper = clamp(p.copperDepth, 0, 254);
    const copper = makeImg(w,h), mask = makeImg(w,h), silk = makeImg(w,h), bottom = makeImg(w,h), comp = makeImg(w,h);
    const sd = src.data, cd = copper.data, md = mask.data, sid = silk.data, bd = bottom.data, pd = comp.data;
    for(let y = 0; y < h; y++){
      const row = y*w;
      for(let x = 0; x < w; x++){
        const i = (row + x)*4;
        const r = sd[i], g = sd[i+1], b = sd[i+2];
        const gray = qGrayRgb(r,g,b);
        const grayPct = Math.round(gray*100/255);
        const isMetalPx = isMetal(r,g,b, p.finishType, p.goldThresh);
        const silkPx = !isMetalPx && (p.isWhiteMask ? (gray < (255 - p.silkThresh)) : (gray > p.silkThresh));
        let copperUnderMask = !isMetalPx && !silkPx && (p.isWhiteMask ? (gray < effCopper) : (gray > effCopper));
        let barePx = false;
        if(p.enableBare && !isMetalPx){
          if(p.bareGrayMode) barePx = (grayPct >= grayMinPct && grayPct <= grayMaxPct);
          else barePx = colorSimilarityPercent({r,g,b}, bareColor) >= simThresh;
        }
        if(barePx) copperUnderMask = false;
        const maskOpen = isMetalPx || (silkPx && !p.isWhiteMask) || barePx;

        cd[i] = cd[i+1] = cd[i+2] = (isMetalPx || copperUnderMask) ? 255 : 0; cd[i+3] = 255;
        md[i] = md[i+1] = md[i+2] = maskOpen ? 255 : 0; md[i+3] = 255;
        sid[i] = sid[i+1] = sid[i+2] = (silkPx && !barePx) ? 255 : 0; sid[i+3] = 255;
        // 安装版语义：白色是开窗透光区，后续生产图会统一反色导出。
        bd[i] = bd[i+1] = bd[i+2] = gray > p.transThresh ? 255 : 0; bd[i+3] = 255;

        let pr = { r:40, g:35, b:25 };
        if(isMetalPx) pr = metalColor;
        else if(barePx) pr = bareColor;
        else {
          if(!maskOpen){
            if(p.isWhiteMask){
              const applied = copperUnderMask ? blendColor(maskColor, {r:200,g:200,b:210}, 60) : maskColor;
              pr = blendColor(pr, applied, 250);
            } else {
              const applied = copperUnderMask ? lighter(maskColor, 135) : maskColor;
              pr = blendColor(pr, applied, copperUnderMask ? 170 : 205);
            }
          }
          if(silkPx) pr = silkColor;
        }
        pd[i] = pr.r; pd[i+1] = pr.g; pd[i+2] = pr.b; pd[i+3] = 255;
      }
    }
    return { copper, mask, silk, bottom, composite: comp };
  }
}

/* ---------------- 边缘处理（拉普拉斯 / Canny / DP） ---------------- */
function perpendicularDistance(a, b, p){
  const dx = b.x - a.x, dy = b.y - a.y;
  const num = Math.abs(dy*p.x - dx*p.y + b.x*a.y - b.y*a.x);
  const den = Math.sqrt(dx*dx + dy*dy);
  return den === 0 ? 0 : num/den;

function extractConnectedComponents(mask){
  const comps = [];

  if(!w || !h) return comps;

  const dx = [1,1,0,-1,-1,-1,0,1], dy = [0,1,1,1,0,-1,-1,-1];
  for(let y = 1; y < h-1; y++){
    for(let x = 1; x < w-1; x++){
      const id = y*w + x;
      if(!d[id] || visited[id]) continue;
      const stack = [id]; visited[id] = 1;
      const comp = [];
      while(stack.length){
        const p = stack.pop();
        const px = p % w, py = Math.floor(p / w);
        comp.push({x:px, y:py});
        for(let k = 0; k < 8; k++){
          const nx = px + dx[k], ny = py + dy[k];
          if(nx <= 0 || nx >= w-1 || ny <= 0 || ny >= h-1) continue;
          const nid = ny*w + nx;
          if(!visited[nid] && d[nid]){
            visited[nid] = 1; stack.push(nid);
          }
        }
      }
      if(comp.length >= 2) comps.push(comp);
    }
  }

}
function douglasPeuckerSimplify(pts, eps){
  const n = pts.length;
  if(n < 3) return pts.slice();
  if(eps <= 0) eps = 1e-3;
  const keep = new Array(n).fill(false);
  keep[0] = true; keep[n-1] = true;
  const stack = [[0, n-1]];
  while(stack.length){
    const s = stack.pop(), s0 = s[0], s1 = s[1];
    let idxMax = s0, distMax = 0;
    for(let i = s0+1; i < s1; i++){
      const d = perpendicularDistance(pts[s0], pts[s1], pts[i]);
      if(d > distMax){ distMax = d; idxMax = i; }
    }
    if(distMax > eps){
      keep[idxMax] = true;
      stack.push([idxMax, s1]);
      stack.push([s0, idxMax]);
    }
  }
  const out = [];
  for(let i = 0; i < n; i++) if(keep[i]) out.push(pts[i]);
  return out;
}

class EdgeSharpener {

  reset(){

    this.workPrefilter = null; this.workKernel = 0; this.workSigma = 0; this.workImage = null;
    this.cacheKey = null; this.w = 0; this.h = 0;

  }

    const changed = this.workSource !== src || this.workW !== src.width || this.workH !== src.height
      || this.workPrefilter !== enablePreFilter || this.workKernel !== kernelSize
      || Math.abs(this.workSigma - sigma) > 1e-6;

    this.workSource = src; this.workW = src.width; this.workH = src.height;

    const w = this.w, h = this.h, d = src.data;
    this.gray = new Int32Array(w*h);
    this.edgeStrength = new Int32Array(w*h);
    this.integral = new Float64Array((w+1)*(h+1));
    this.sobelMag = null; this.sobelDir = null; this.cannyNms = null; this.cannyReady = false;

      const i = (y*w + x)*4;
      this.gray[y*w + x] = qGrayRgb(d[i], d[i+1], d[i+2]);
    }
    for(let y = 1; y < h-1; y++) for(let x = 1; x < w-1; x++){
      const c = this.gray[y*w + x];
      this.edgeStrength[y*w + x] = Math.abs(4*c - this.gray[y*w + x - 1] - this.gray[y*w + x + 1]

/* ---------------- 生产层生成 / 导出 ---------------- */
function invertImg(img){
  const out = makeImg(img.width, img.height);
  const d = img.data, o = out.data;
  for(let i = 0; i < d.length; i += 4){
    o[i] = 255 - d[i]; o[i+1] = 255 - d[i+1]; o[i+2] = 255 - d[i+2]; o[i+3] = d[i+3];
  }
  return out;
}
function generateLayers(copper, mask, silk, bottom){
  return {
    Top_Copper:invertImg(copper), Top_Mask:invertImg(mask), Top_Silk:invertImg(silk),
    Bottom_Mask:invertImg(bottom)
  };
}

/* ---------------- 纯灰度三分分层（Processerv_2 语义） ---------------- */
const MASK_COLOR_IDS = ['blue', 'black', 'red', 'green', 'white'];
const GRAY_DEFAULTS = { silkThreshold:100, maskThreshold:150, thickRadius:0, blurRadius:0, previewMaskId:'blue' };

  return getSolderMaskColor(MASK_COLOR_IDS.includes(maskId) ? maskId : GRAY_DEFAULTS.previewMaskId);

  let sum = 0;
  for(let i = -rs; i <= rs; i++){ const weight = Math.exp(-(i*i) / (2*radius*radius)); weights[i+rs] = weight; sum += weight; }
  for(let i = 0; i < weights.length; i++) weights[i] /= sum;
  const temp = new Float32Array(w*h), out = new Float32Array(w*h);
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    let value = 0;
    for(let dx = -rs; dx <= rs; dx++) value += src[y*w + clamp(x+dx, 0, w-1)] * weights[dx+rs];
    temp[y*w+x] = value;
  }
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    let value = 0;
    for(let dy = -rs; dy <= rs; dy++) value += temp[clamp(y+dy, 0, h-1)*w + x] * weights[dy+rs];
    out[y*w+x] = value;
  }
  return out;
}
function processGrayLayers(src, p){
  const w = src.width, h = src.height, sd = src.data;
  let lumas = new Float32Array(w*h);
  for(let i = 0, px = 0; i < sd.length; i += 4, px++){
    // 与上传版本一致：近透明像素归为白色，避免其被误分到丝印层。
    lumas[px] = sd[i+3] < 30 ? 255 : 0.299*sd[i] + 0.587*sd[i+1] + 0.114*sd[i+2];
  }
  if(p.blurRadius > 0) lumas = gaussianBlurGray(lumas, w, h, p.blurRadius);

  const copper = makeImg(w,h), mask = makeImg(w,h), silk = makeImg(w,h), composite = makeImg(w,h);
  const cd = copper.data, md = mask.data, sid = silk.data, pd = composite.data;
  const t1 = clamp(p.silkThreshold, 0, 255), t2 = clamp(p.maskThreshold, 0, 255);
  // 原页面用 parseInt 读取该滑块；这里保留其整数像素半径语义。
  const radius = clamp(Math.trunc(p.thickRadius), 0, 12);
  const mid = grayPreviewColor(p.previewMaskId);
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    const px = y*w + x, i = px*4;
    let luma = lumas[px];
    if(radius > 0 && luma >= t1){
      let minLuma = luma;
      for(let dy = -radius; dy <= radius; dy++) for(let dx = -radius; dx <= radius; dx++){
        if(dx*dx + dy*dy > radius*radius) continue;
        const nx = x + dx, ny = y + dy;
        if(nx >= 0 && nx < w && ny >= 0 && ny < h) minLuma = Math.min(minLuma, lumas[ny*w+nx]);
      }
      luma = minLuma;
    }
    if(luma < t1){
      sid[i]=sid[i+1]=sid[i+2]=255; sid[i+3]=255;
      pd[i]=pd[i+1]=pd[i+2]=0; pd[i+3]=255;
    } else if(luma < t2){
      md[i]=md[i+1]=md[i+2]=255; md[i+3]=255;
      pd[i]=mid.r; pd[i+1]=mid.g; pd[i+2]=mid.b; pd[i+3]=255;
    } else {
      cd[i]=cd[i+1]=cd[i+2]=255; cd[i+3]=255;
      pd[i]=pd[i+1]=pd[i+2]=255; pd[i+3]=255;
    }
  }
  return { copper, mask, silk, composite };
}

/* ---------------- 渐进渲染（像素预算自适应） ---------------- */
function sizeForPixelBudget(sw, sh, targetPixels){
  if(sw <= 0 || sh <= 0 || targetPixels <= 0) return {w:0, h:0};
  const srcPixels = sw*sh;
  if(srcPixels <= targetPixels) return {w:sw, h:sh};
  const scale = Math.sqrt(targetPixels/srcPixels);
  let w = Math.max(1, Math.floor(sw*scale));
  let h = Math.max(1, Math.floor(sh*scale));
  if(w*h > targetPixels){
    if(w >= h) w = Math.max(1, Math.floor(targetPixels/h));
    else h = Math.max(1, Math.floor(targetPixels/w));
  }
  return {w, h};
}
function interactivePreviewSize(src){ return sizeForPixelBudget(src.w, src.h, 200000); }
function refinementSizes(src){
  const sizes = [];
  const r = sizeForPixelBudget(src.w, src.h, 1000000);
  if(!(r.w === src.w && r.h === src.h)) sizes.push(r);
  const last = sizes[sizes.length-1];
  if(!last || last.w !== src.w || last.h !== src.h) sizes.push({w:src.w, h:src.h});
  return sizes;
}

/* ---------------- 应用状态 ---------------- */
const state = {
  origin: null,          // 原图 ImageData
  originCanvas: null,    // 原图 canvas（导出/工程用）
  processingMode: 'gray', // color: 现有彩色识别；gray: 纯灰度三分
  viewMode: 'overlay',   // 仅控制预览布局，不影响分层、导出或工程数据
  gray: { ...GRAY_DEFAULTS },
  generation: 0,
  fullResGeneration: -1,
  layers: null,          // 权威生产层（可导出）
  previewLayers: null,   // 当前预览层
  composite: null,       // 当前预览合成图 ImageData
  prefilter: { enabled:true, kernel:5, sigma:1.1 },
  dp: { enabled:false, tolerance:1.0, lineWidth:2 },
  light: { showOverlay:false, autoSense:1, radius:150, intensity:200, strips:[], pendingStart:null }
};

const prc = {
  sourceSize: {w:0, h:0},
  generation: 0,
  refinementGeneration: 0,
  refinementSizes: [],
  nextRefinementIndex: 0,
  interactiveTimer: null,
  interactivePending: false
};
function prcInvalidate(){
  if(prc.interactiveTimer){ clearTimeout(prc.interactiveTimer); prc.interactiveTimer = null; }
  prc.interactivePending = false;
  prc.generation++;
  prc.refinementGeneration = 0;
  prc.refinementSizes = [];
  prc.nextRefinementIndex = 0;
  return prc.generation;
}
function prcSliderPressed(src){ prcInvalidate(); prc.sourceSize = src; }
function prcControllerRender(tw, th, generation, authoritative){
  renderAtSize(tw, th, generation, authoritative);
  prcRenderFinished(generation);
}
function prcRenderFinished(generation){
  if(generation !== prc.generation || generation !== prc.refinementGeneration) return;
  prcQueueNextRefinement(generation, 25);
}
function prcStartInteractiveTimer(){
  prc.interactiveTimer = setTimeout(() => {
    prc.interactiveTimer = null;
    if(!prc.interactivePending || !prc.sourceSize || prc.sourceSize.w <= 0) return;
    prc.interactivePending = false;
    prcStartInteractiveTimer();
    const sz = interactivePreviewSize(prc.sourceSize);
    prcControllerRender(sz.w, sz.h, prc.generation, false);
  }, 30);
}
function prcSliderValueChanged(src){
  prc.sourceSize = src;
  prc.generation++;
  prc.refinementGeneration = 0;
  prc.refinementSizes = [];
  prc.nextRefinementIndex = 0;
  if(!src || src.w <= 0){
    prc.interactivePending = false;
    if(prc.interactiveTimer){ clearTimeout(prc.interactiveTimer); prc.interactiveTimer = null; }
    return;
  }
  if(prc.interactiveTimer){ prc.interactivePending = true; return; }
  prc.interactivePending = false;
  prcStartInteractiveTimer();
  const sz = interactivePreviewSize(src);
  prcControllerRender(sz.w, sz.h, prc.generation, false);
}
function prcSliderReleased(src){
  const g = prcInvalidate();
  prc.sourceSize = src;
  prc.refinementSizes = refinementSizes(src);
  prc.nextRefinementIndex = 0;
  prc.refinementGeneration = g;
  prcQueueNextRefinement(g, 0);
}
function prcQueueNextRefinement(g, delay){
  setTimeout(() => prcRequestNextRefinement(g), delay);
}
function prcRequestNextRefinement(g){
  if(g !== prc.generation || g !== prc.refinementGeneration) return;
  if(prc.nextRefinementIndex >= prc.refinementSizes.length) return;
  const t = prc.refinementSizes[prc.nextRefinementIndex++];
  const authoritative = (t.w === prc.sourceSize.w && t.h === prc.sourceSize.h);
  prcControllerRender(t.w, t.h, g, authoritative);
}

/* ---------------- 渲染管线（等价 renderAtSize） ---------------- */
const imageProcessor = new ImageProcessor();
const edgeSharpener = new EdgeSharpener();

function renderOriginForSize(tw, th){
  if(tw === state.origin.width && th === state.origin.height) return state.origin;
  if(!state._roCache || state._roCache.src !== state.origin || state._roCache.w !== tw || state._roCache.h !== th){
    state._roCache = { src: state.origin, w: tw, h: th, img: scaleImageData(state.origin, tw, th) };
  }
  return state._roCache.img;
}

function pointToSegmentDistance(x, y, start, end){
  const dx = end.x-start.x, dy = end.y-start.y, len2 = dx*dx + dy*dy;
  if(len2 === 0) return Math.hypot(x-start.x, y-start.y);
  const t = clamp(((x-start.x)*dx + (y-start.y)*dy) / len2, 0, 1);
  return Math.hypot(x-(start.x+t*dx), y-(start.y+t*dy));
}
function scaleLightStrips(strips, sw, sh, tw, th){
  const sx = tw/sw, sy = th/sh, radiusScale = Math.min(sx, sy);
  return strips.map(strip => ({
    start:{ x:Math.round(strip.start.x*sx), y:Math.round(strip.start.y*sy) },
    end:{ x:Math.round(strip.end.x*sx), y:Math.round(strip.end.y*sy) },
    color:strip.color,
    radius:Math.max(1, Math.round(state.light.radius*radiusScale))
  }));
}
function drawLightCapsules(composite, strips){
  const canvas = document.createElement('canvas');
  canvas.width = composite.width; canvas.height = composite.height;
  const ctx = canvas.getContext('2d');
  ctx.putImageData(composite, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for(const strip of strips){
    const dx = strip.end.x-strip.start.x, dy = strip.end.y-strip.start.y;
    const length = Math.hypot(dx, dy), radius = strip.radius;
    ctx.save();
    ctx.translate((strip.start.x+strip.end.x)/2, (strip.start.y+strip.end.y)/2);
    ctx.rotate(Math.atan2(dy, dx));
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = Math.max(1, composite.width/300); ctx.setLineDash([7, 5]);
    ctx.beginPath();
    const left = -length/2-radius, top = -radius, width = length+radius*2, height = radius*2;
    if(typeof ctx.roundRect === 'function') ctx.roundRect(left, top, width, height, radius);
    else { // 兼容不支持 roundRect 的浏览器，仍绘制同样的灯光胶囊轮廓。
      ctx.moveTo(left+radius, top); ctx.lineTo(left+width-radius, top); ctx.arcTo(left+width, top, left+width, top+radius, radius);
      ctx.lineTo(left+width, top+height-radius); ctx.arcTo(left+width, top+height, left+width-radius, top+height, radius);
      ctx.lineTo(left+radius, top+height); ctx.arcTo(left, top+height, left, top+height-radius, radius);
      ctx.lineTo(left, top+radius); ctx.arcTo(left, top, left+radius, top, radius);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgb(' + strip.color.r + ',' + strip.color.g + ',' + strip.color.b + ')';
    ctx.lineWidth = clamp(composite.width/700, 1, 3);
    ctx.beginPath(); ctx.moveTo(-length/2, 0); ctx.lineTo(length/2, 0); ctx.stroke();
    ctx.restore();
  }
  composite.data.set(ctx.getImageData(0, 0, composite.width, composite.height).data);
}
function renderLightsOnComposite(composite, copper, bottom, strips, intensity){
  const cd = composite.data, copperData = copper.data, bottomData = bottom.data, w = composite.width, h = composite.height;
  for(const strip of strips){
    const radius = strip.radius;
    const minX = clamp(Math.floor(Math.min(strip.start.x, strip.end.x)-radius), 0, w-1);
    const maxX = clamp(Math.ceil(Math.max(strip.start.x, strip.end.x)+radius), 0, w-1);
    const minY = clamp(Math.floor(Math.min(strip.start.y, strip.end.y)-radius), 0, h-1);
    const maxY = clamp(Math.ceil(Math.max(strip.start.y, strip.end.y)+radius), 0, h-1);
    for(let y = minY; y <= maxY; y++) for(let x = minX; x <= maxX; x++){
      const pixel = (y*w+x)*4;
      // 与安装版一致：敷铜或背透层的非开窗区域均阻挡灯光。
      if(copperData[pixel] > 128 || bottomData[pixel] < 128) continue;
      const distance = pointToSegmentDistance(x, y, strip.start, strip.end);
      if(distance >= radius) continue;
      const alpha = clamp(Math.round(intensity*Math.pow(1-distance/radius, 1.8)), 0, 255) / 255;
      cd[pixel] = Math.round(strip.color.r*alpha + cd[pixel]*(1-alpha));
      cd[pixel+1] = Math.round(strip.color.g*alpha + cd[pixel+1]*(1-alpha));
      cd[pixel+2] = Math.round(strip.color.b*alpha + cd[pixel+2]*(1-alpha));
    }
  }
  drawLightCapsules(composite, strips);
}
function autoSuggestLights(){
  if(!state.origin || state.processingMode !== 'color') return;
  const count = Math.trunc(state.light.autoSense);
  state.light.pendingStart = null;
  if(count <= 0){ state.light.strips = []; updateProcess(); return; }
  const buckets = new Map(), src = state.origin, d = src.data;
  for(let y = 0; y < src.height; y += 15) for(let x = 0; x < src.width; x += 15){
    const i = (y*src.width+x)*4, value = Math.max(d[i], d[i+1], d[i+2]);
    if(d[i+3] < 30 || value <= 80) continue;
    const hsv = rgbToHsv(d[i], d[i+1], d[i+2]), key = hsv.s < 30 ? -1 : Math.floor(hsv.h/30);
    const bucket = buckets.get(key) || { points:[], weight:0 };
    bucket.points.push({x,y,color:{r:d[i],g:d[i+1],b:d[i+2],value}}); bucket.weight += value;
    buckets.set(key, bucket);
  }
  const strips = [];
  for(const bucket of [...buckets.values()].sort((a,b) => b.weight-a.weight)){
    if(strips.length >= count) break;
    let best = null;
    for(const point of bucket.points){
      if(best && point.color.value <= best.color.value) continue;
      const start = {x:point.x, y:clamp(point.y-25, 0, src.height-1)};
      const end = {x:point.x, y:clamp(point.y+25, 0, src.height-1)};
      if(strips.some(strip => pointToSegmentDistance(start.x, start.y, strip.start, strip.end) < state.light.radius + strip.radius || pointToSegmentDistance(end.x, end.y, strip.start, strip.end) < state.light.radius + strip.radius)) continue;
      best = { start, end, color:point.color };
    }
    if(best) strips.push({ start:best.start, end:best.end, radius:state.light.radius, color:best.color });
  }
  state.light.strips = strips;
  updateProcess();
}

function renderAtSize(tw, th, generation, authoritative){
  if(!state.origin || tw <= 0 || th <= 0) return;
  const renderOrigin = renderOriginForSize(tw, th);

  if(state.processingMode === 'gray'){
    const gray = processGrayLayers(renderOrigin, state.gray);
    const layers = { Top_Copper:gray.copper, Top_Mask:gray.mask, Top_Silk:gray.silk };
    state.composite = gray.composite;
    state.previewLayers = layers;
    refreshPreviews();
    if(authoritative && renderOrigin.width === state.origin.width && renderOrigin.height === state.origin.height){
      state.layers = layers;
      state.fullResGeneration = generation;
    }
    return;
  }

  const maskColorName = el('#selectMask').value;
  const finishType = el('#selectFinish').value;
  const isWhiteMask = maskColorName === 'white';
  const enableBare = masterState.bare;
  const bareGrayMode = el('#radioBareGray').checked;
  const useMetalEdge = el('#chkUseMetal').checked;
  const metalEdgeColor = getMetalRenderColor(finishType);
  const edgeMode = el('#radioEdgeStroke').checked ? 'canny' : 'enhance';

  const goldThresh = sliderVal('#sliderGold');
  const silkThresh = sliderVal('#sliderSilk');
  const transThresh = sliderVal('#sliderTrans');
  const copperDepth = sliderVal('#sliderCopper');

  let edgeMask = null;
  if(masterState.edge){
    edgeMask = edgeSharpener.buildEdgeMaskForImage(
      renderOrigin, edgeMode,
      sliderVal('#sliderEdgeThresh'), sliderVal('#sliderEdgeThreshMax'),
      state.prefilter.enabled, state.prefilter.kernel, state.prefilter.sigma);
  }

  const p = {
    finishType, maskColorName, isWhiteMask,
    goldThresh, silkThresh, transThresh, copperDepth,
    enableBare, bareGrayMode,
    bareGrayMin: sliderVal('#sliderBareA'), bareGrayMax: sliderVal('#sliderBareB'), bareSim: sliderVal('#sliderBareSim')
  };
  const mutableLayers = !!edgeMask;
  let { copper, mask, silk, bottom, composite } = imageProcessor.processImage(renderOrigin, p, mutableLayers);

  if(edgeMask){
    const w = Math.min(edgeMask.w, copper.width), h = Math.min(edgeMask.h, copper.height);
    const silkColor = getSilkColor(maskColorName);
    const cd = copper.data, md = mask.data, sid = silk.data, pd = composite.data, em = edgeMask.data;
    if(useMetalEdge){
      const mr = metalEdgeColor.r, mg = metalEdgeColor.g, mb = metalEdgeColor.b;
      const maskColor = getSolderMaskColor(maskColorName);
      const pmLight = lighter(maskColor, 135);
      const expose = el('#chkExposeMetal').checked;
      for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
        const ei = y*w + x;
        if(em[ei] > 0){
          const i = ei*4;
          cd[i]=cd[i+1]=cd[i+2]=255;
          if(expose){
            sid[i]=sid[i+1]=sid[i+2]=0;
            md[i]=md[i+1]=md[i+2]=255;
            pd[i]=mr; pd[i+1]=mg; pd[i+2]=mb;
          } else {
            const blended = blendColor({r:pd[i], g:pd[i+1], b:pd[i+2]}, pmLight, 170);
            pd[i]=blended.r; pd[i+1]=blended.g; pd[i+2]=blended.b;
          }
        }
      }
    } else {
      const sr = silkColor.r, sg = silkColor.g, sb = silkColor.b;
      for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
        const ei = y*w + x;
        if(em[ei] > 0){
          const i = ei*4;
          sid[i]=sid[i+1]=sid[i+2]=255;
          pd[i]=sr; pd[i+1]=sg; pd[i+2]=sb;
        }
      }
    }
  }

  const layers = generateLayers(copper, mask, silk, bottom);

  if(masterState.light && state.light.showOverlay && state.light.strips.length){
    // 灯光只叠加到合成预览；生产层保持干净，导出结果不受布灯影响。
    composite = cloneImg(composite);
    const strips = scaleLightStrips(state.light.strips, state.origin.width, state.origin.height, composite.width, composite.height);
    renderLightsOnComposite(composite, copper, bottom, strips, state.light.intensity);
  }

  state.composite = composite;
  state.previewLayers = layers;

  refreshPreviews();

  if(authoritative && renderOrigin.width === state.origin.width && renderOrigin.height === state.origin.height){
    state.layers = layers;
    state.fullResGeneration = generation;
  }
}

/* 非滑块修改：全分辨率重渲 */
function updateProcess(){
  if(!state.origin) return;
  const g = prcInvalidate();
  renderAtSize(state.origin.width, state.origin.height, g, true);
}

/* ---------------- UI 元素获取 ---------------- */
function el(sel){ return document.querySelector(sel); }
function sliderVal(sel){
  const e = el(sel);
  if(!e) return 0;
  const input = e.querySelector('input');
  return input ? (parseFloat(input.value) || 0) : 0;
}

/* 折叠组：master 状态（bare/edge 展开=启用） */
const masterState = { light:false, bare:false, edge:false };

function transitionSegmentedSelection(buttons, nextButton){
  const list = Array.from(buttons);
  const previous = list.find(button => button.classList.contains('active'));
  if(previous === nextButton) return;
  list.forEach(button => {
    if(button._selectionTimer) clearTimeout(button._selectionTimer);
    button.classList.remove('is-switching-in', 'is-switching-out');
  });
  if(previous){
    previous.classList.remove('active');
    previous.classList.add('is-switching-out');
  }
  nextButton.classList.add('active', 'is-switching-in');
  [previous, nextButton].filter(Boolean).forEach(button => {
    button._selectionTimer = setTimeout(() => button.classList.remove('is-switching-in', 'is-switching-out'), 220);
  });
}

function setProcessingMode(mode, shouldRender){
  state.processingMode = mode === 'gray' ? 'gray' : 'color';
  const isGray = state.processingMode === 'gray';
  if(isGray) state.light.pendingStart = null;
  el('#colorControls').hidden = isGray;
  el('#grayControls').hidden = !isGray;
  // 灰度模式保留第四个预览格，但明确显示为无输出，避免布局跳变。
  el('#bottomPreviewItem').hidden = false;
  el('#exportBottomOption').hidden = isGray;
  if(isGray && el('#selectExportLayer').value === 'Bottom_Mask') el('#selectExportLayer').value = 'Top_Silk';
  syncQuadPrimaryLabel();
  const modeButtons = document.querySelectorAll('[data-processing-mode]');
  const nextButton = Array.from(modeButtons).find(btn => btn.dataset.processingMode === state.processingMode);
  if(shouldRender && nextButton) transitionSegmentedSelection(modeButtons, nextButton);
  else modeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.processingMode === state.processingMode));
  if(shouldRender && state.origin) updateProcess();
  schedulePreviewResize();
}

function setViewMode(mode){
  state.viewMode = ['overlay', 'split', 'quad'].includes(mode) ? mode : 'overlay';
  const isQuad = state.viewMode === 'quad';
  el('#compositeWrap').hidden = isQuad;
  el('#quadGrid').hidden = !isQuad;
  el('#colLayers').style.display = state.viewMode === 'split' ? 'flex' : 'none';
  document.querySelectorAll('[data-view-mode]').forEach(btn => btn.classList.toggle('active', btn.dataset.viewMode === state.viewMode));
  updateQuadPlaceholders();
  syncPreviewImageMeta();
  // 先同步当前尺寸，再在布局稳定后复核一次，避免隐藏画布被浏览器拉伸。
  schedulePreviewResize();
}

function setGroupOpen(groupId, open, withMaster){
  const g = el('#'+groupId);
  if(open) g.classList.add('open'); else g.classList.remove('open');
  if(withMaster){
    const k = g.getAttribute('data-master');
    if(k) masterState[k] = open;
  }
}

/* ---------------- 预览画布 ---------------- */
const previewStates = {
  composite: { canvas:'#canvasComposite', img:null, srcCanvas:null, zoom:1, pan:{x:0,y:0} },
  copper:    { canvas:'#canvasCopper',   img:null, srcCanvas:null, zoom:1, pan:{x:0,y:0} },
  mask:      { canvas:'#canvasMask',     img:null, srcCanvas:null, zoom:1, pan:{x:0,y:0} },
  silk:      { canvas:'#canvasSilk',     img:null, srcCanvas:null, zoom:1, pan:{x:0,y:0} },
  bottom:    { canvas:'#canvasBottom',   img:null, srcCanvas:null, zoom:1, pan:{x:0,y:0} }
};
const quadPreviewCanvases = {
  primary:'#canvasQuadPrimary', silk:'#canvasQuadSilk', mask:'#canvasQuadMask', copper:'#canvasQuadCopper'
};
// 四分视图共享相机，保证任意窗口操作后四张图保持同一观察位置。
const quadCamera = { zoom:1, pan:{x:0,y:0} };
// 分隔视图也复用同一相机，使主预览与三个生产层始终同步。
const splitCamera = { zoom:1, pan:{x:0,y:0} };

function quadPreviewKey(key){
  return key === 'primary' ? (state.processingMode === 'color' ? 'bottom' : 'composite') : key;
}
function syncQuadPrimaryLabel(){
  const title = el('#quadPrimaryTitle');
  if(!title) return;
  title.dataset.i18n = state.processingMode === 'color' ? 'layerBottom' : 'viewOverlay';
  title.textContent = t(title.dataset.i18n);
}

function syncPreviewImageMeta(){
  const mainMeta = el('#previewImageMeta');
  if(!mainMeta) return;
  if(!state.origin){
    mainMeta.hidden = true;
    return;
  }
  const zoom = state.viewMode === 'quad' ? quadCamera.zoom : (state.viewMode === 'split' ? splitCamera.zoom : previewStates.composite.zoom);
  const pixels = new Intl.NumberFormat(document.documentElement.lang || currentLanguage).format(state.origin.width * state.origin.height);
  const text = t('previewImageMeta', { pixels, width:state.origin.width, height:state.origin.height, zoom:Math.round(zoom * 100) });
  mainMeta.textContent = text;
  // 元信息保持在网格外，避免四分视图只有叠加格被额外文本压缩。
  mainMeta.hidden = false;
}

function calcPreviewRect(labelW, labelH, imgW, imgH, zoom, pan){
  if(labelW <= 0 || labelH <= 0 || imgW <= 0 || imgH <= 0) return {x:0,y:0,w:0,h:0};
  const fit = Math.min(labelW/imgW, labelH/imgH);
  const dw = imgW*fit*zoom, dh = imgH*fit*zoom;
  return { x:(labelW-dw)*0.5 + pan.x, y:(labelH-dh)*0.5 + pan.y, w:dw, h:dh };
}
function clampPanForImage(view, img, cw, ch){
  if(!img) { view.pan = {x:0,y:0}; return; }
  const r = calcPreviewRect(cw, ch, img.width, img.height, view.zoom, {x:0,y:0});
  const maxX = Math.max(0, (r.w - cw)*0.5), maxY = Math.max(0, (r.h - ch)*0.5);
  view.pan.x = clamp(view.pan.x, -maxX, maxX);
  view.pan.y = clamp(view.pan.y, -maxY, maxY);
}
function setPreviewImage(st, img){
  st.img = img;
  st.srcCanvas = null; // 懒创建：仅在实际绘制时生成画布，折叠/未展开的层预览不占内存
}
function renderPreviewCanvas(st, canvasEl, view, isComposite){
  view = view || st;
  const ctx = canvasEl.getContext('2d');
  const cw = canvasEl.width, ch = canvasEl.height;
  const isGrayEmptyBottom = state.processingMode === 'gray' && st === previewStates.bottom && !st.img;
  if(isGrayEmptyBottom){
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#9d9d9d';
    ctx.font = '13px "Microsoft YaHei", "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('noOutput'), cw * 0.5, ch * 0.5);
    return;
  }
  if(state.processingMode === 'gray' && !isComposite){
    // 透明生产层需要可见的底色；合成预览仍保持原有深色背景。
    const size = 12;
    for(let y = 0; y < ch; y += size) for(let x = 0; x < cw; x += size){
      ctx.fillStyle = ((x/size + y/size) % 2 === 0) ? '#262626' : '#171717';
      ctx.fillRect(x, y, size, size);
    }
  } else {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, cw, ch);
  }
  if(!st.img) return;
  if(!st.srcCanvas) st.srcCanvas = toCanvas(st.img);
  clampPanForImage(view, st.img, cw, ch);
  const rect = calcPreviewRect(cw, ch, st.img.width, st.img.height, view.zoom, view.pan);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(st.srcCanvas, rect.x, rect.y, rect.w, rect.h);
}
function refreshPreviews(){
  if(state.composite){ setPreviewImage(previewStates.composite, state.composite); el('#compositePlaceholder').style.display = 'none'; }
  const keys = { copper:'Top_Copper', mask:'Top_Mask', silk:'Top_Silk', bottom:'Bottom_Mask' };
  if(state.previewLayers){
    for(const k in keys) setPreviewImage(previewStates[k], state.previewLayers[keys[k]] || null);
  }
  updateQuadPlaceholders();
  syncPreviewImageMeta();
  renderAllPreviews();
}
function updateQuadPlaceholders(){
  document.querySelectorAll('[data-quad-placeholder]').forEach(node => {
    node.style.display = previewStates[quadPreviewKey(node.dataset.quadPlaceholder)].img ? 'none' : 'flex';
  });
}
function renderAllPreviews(){
  for(const k in previewStates){
    const st = previewStates[k];
    const c = el(st.canvas);
    const view = state.viewMode === 'split' ? splitCamera : st;
    if(c.width > 0 && c.height > 0) renderPreviewCanvas(st, c, view, k === 'composite');
  }
  if(state.viewMode === 'quad'){
    for(const k in quadPreviewCanvases){
      const c = el(quadPreviewCanvases[k]);
      const previewKey = quadPreviewKey(k);
      if(c.width > 0 && c.height > 0) renderPreviewCanvas(previewStates[previewKey], c, quadCamera, previewKey === 'composite');
    }
  }
}
let pendingPreviewResize = 0;
function resizeCanvases(){
  for(const k in previewStates){
    const st = previewStates[k];
    const c = el(st.canvas);
    const parent = c.parentElement;
    if(parent && parent.clientWidth > 0 && parent.clientHeight > 0){
      c.width = parent.clientWidth; c.height = parent.clientHeight;
    }
  }
  for(const k in quadPreviewCanvases){
    const c = el(quadPreviewCanvases[k]);
    const parent = c.parentElement;
    if(parent && parent.clientWidth > 0 && parent.clientHeight > 0){
      c.width = parent.clientWidth; c.height = parent.clientHeight;
    }
  }
  renderAllPreviews();
}
function schedulePreviewResize(){
  if(pendingPreviewResize) cancelAnimationFrame(pendingPreviewResize);
  // display 切换后此刻已可读取可见容器的尺寸，立即重绘可避免旧位图被 CSS 拉伸。
  resizeCanvases();
  pendingPreviewResize = requestAnimationFrame(() => {
    pendingPreviewResize = requestAnimationFrame(() => {
      pendingPreviewResize = 0;
      resizeCanvases();
    });
  });
}

/* ---------------- 预览交互 ---------------- */
function attachPreviewInteraction(key){
  const st = previewStates[key];
  const c = el(st.canvas);
  let panning = false, lastX = 0, lastY = 0;
  c.addEventListener('wheel', function(e){
    e.preventDefault();
    if(!st.img) return;
    const view = state.viewMode === 'split' ? splitCamera : st;
    // 与 Windows 图片查看器一致：滚轮向上放大，向下缩小。
    const factor = Math.pow(1.12, -e.deltaY/120);
    const oldZoom = view.zoom;
    const newZoom = clamp(oldZoom*factor, 0.2, 8.0);
    if(Math.abs(newZoom-oldZoom) < 1e-6) return;
    const r = c.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    const oldRect = calcPreviewRect(c.width, c.height, st.img.width, st.img.height, oldZoom, view.pan);
    view.zoom = newZoom;
    if(cx >= oldRect.x && cx <= oldRect.x+oldRect.w && cy >= oldRect.y && cy <= oldRect.y+oldRect.h){
      const u = (cx-oldRect.x)/oldRect.w, v = (cy-oldRect.y)/oldRect.h;
      const nr = calcPreviewRect(c.width, c.height, st.img.width, st.img.height, newZoom, view.pan);
      const mx = nr.x + u*nr.w, my = nr.y + v*nr.h;
      view.pan.x += cx - mx; view.pan.y += cy - my;
    }
    clampPanForImage(view, st.img, c.width, c.height);
    syncPreviewImageMeta();
    if(state.viewMode === 'split') renderAllPreviews();
    else renderPreviewCanvas(st, c, st, key === 'composite');
  }, { passive:false });

  c.addEventListener('pointerdown', function(e){
    if(e.button === 1 || e.button === 2){
      panning = true; lastX = e.clientX; lastY = e.clientY;
      c.style.cursor = 'grabbing';
      e.preventDefault();
    }
  });
  window.addEventListener('pointermove', function(e){
    if(!panning) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    const view = state.viewMode === 'split' ? splitCamera : st;
    view.pan.x += dx; view.pan.y += dy;
    clampPanForImage(view, st.img, c.width, c.height);
    if(state.viewMode === 'split') renderAllPreviews();
    else renderPreviewCanvas(st, c, st, key === 'composite');
  });
  window.addEventListener('pointerup', function(e){
    if(panning){ panning = false; c.style.cursor = 'default'; }
  });
  c.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

function attachQuadPreviewInteraction(key){
  const c = el(quadPreviewCanvases[key]);
  const getState = () => previewStates[quadPreviewKey(key)];
  let panning = false, lastX = 0, lastY = 0;
  c.addEventListener('wheel', function(e){
    e.preventDefault();
    const st = getState();
    if(!st.img) return;
    const oldZoom = quadCamera.zoom, newZoom = clamp(oldZoom * Math.pow(1.12, -e.deltaY/120), 0.2, 8.0);
    if(Math.abs(newZoom-oldZoom) < 1e-6) return;
    const r = c.getBoundingClientRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;
    const oldRect = calcPreviewRect(c.width, c.height, st.img.width, st.img.height, oldZoom, quadCamera.pan);
    quadCamera.zoom = newZoom;
    if(cx >= oldRect.x && cx <= oldRect.x+oldRect.w && cy >= oldRect.y && cy <= oldRect.y+oldRect.h){
      const u = (cx-oldRect.x)/oldRect.w, v = (cy-oldRect.y)/oldRect.h;
      const nextRect = calcPreviewRect(c.width, c.height, st.img.width, st.img.height, newZoom, quadCamera.pan);
      quadCamera.pan.x += cx - (nextRect.x + u*nextRect.w);
      quadCamera.pan.y += cy - (nextRect.y + v*nextRect.h);
    }
    clampPanForImage(quadCamera, st.img, c.width, c.height);
    syncPreviewImageMeta();
    renderAllPreviews();
  }, { passive:false });
  c.addEventListener('pointerdown', function(e){
    if(e.button === 1 || e.button === 2){
      panning = true; lastX = e.clientX; lastY = e.clientY; c.style.cursor = 'grabbing'; e.preventDefault();
    }
  });
  window.addEventListener('pointermove', function(e){
    if(!panning) return;
    const st = getState();
    quadCamera.pan.x += e.clientX - lastX; quadCamera.pan.y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    clampPanForImage(quadCamera, st.img, c.width, c.height);
    renderAllPreviews();
  });
  window.addEventListener('pointerup', function(){ if(panning){ panning = false; c.style.cursor = 'default'; } });
  c.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

function attachLightPlacement(canvasSelector, isQuadCanvas){
  const canvas = el(canvasSelector);
  canvas.addEventListener('pointerdown', function(e){
    if(e.button !== 0 || state.processingMode !== 'color' || !masterState.light || !state.origin) return;
    const st = previewStates.composite;
    if(!st.img) return;
    const view = isQuadCanvas ? quadCamera : (state.viewMode === 'split' ? splitCamera : st);
    const bounds = canvas.getBoundingClientRect();
    const x = (e.clientX-bounds.left)*canvas.width/bounds.width, y = (e.clientY-bounds.top)*canvas.height/bounds.height;
    const rect = calcPreviewRect(canvas.width, canvas.height, st.img.width, st.img.height, view.zoom, view.pan);
    if(x < rect.x || x > rect.x+rect.w || y < rect.y || y > rect.y+rect.h) return;
    const point = {
      x:clamp(Math.floor((x-rect.x)/rect.w*state.origin.width), 0, state.origin.width-1),
      y:clamp(Math.floor((y-rect.y)/rect.h*state.origin.height), 0, state.origin.height-1)
    };
    if(!state.light.pendingStart){
      state.light.pendingStart = point;
      toast(t('lightPlacementStart'));
    } else {
      const i = (point.y*state.origin.width+point.x)*4;
      const color = {r:state.origin.data[i], g:state.origin.data[i+1], b:state.origin.data[i+2]};
      if(Math.max(color.r, color.g, color.b) < 50) color.r = color.g = color.b = 255;
      state.light.strips.push({ start:state.light.pendingStart, end:point, radius:state.light.radius, color });
      state.light.pendingStart = null;
      updateProcess();
    }
    e.preventDefault();
  });
}

/* ---------------- 滑块创建 ---------------- */
let draggingSlider = false;
function createSlider(containerId, titleKey, min, max, def, step, onValueChange){
  const host = document.getElementById(containerId);
  const lab = document.createElement('label');
  lab.className = 'ctl';
  const labText = document.createElement('span');
  labText.className = 'lab';
  labText.dataset.i18nSlider = titleKey;
  const input = document.createElement('input');
  input.type = 'range'; input.min = min; input.max = max; input.step = step || 1; input.value = def;
  refreshSliderLabel(labText, input);
  lab.appendChild(labText); lab.appendChild(input);
  host.appendChild(lab);

  function onInput(){
    refreshSliderLabel(labText, input);
    if(onValueChange) onValueChange(parseFloat(input.value));
    if(!state.origin){ updateProcess(); }
    else if(draggingSlider){ prcSliderValueChanged({w:state.origin.width, h:state.origin.height}); }
    else { updateProcess(); }
  }
  input.addEventListener('input', onInput);
  input.addEventListener('pointerdown', function(){
    draggingSlider = true;
    if(state.origin) prcSliderPressed({w:state.origin.width, h:state.origin.height});
  });
  input.addEventListener('change', function(){
    if(draggingSlider){
      draggingSlider = false;
      if(state.origin) prcSliderReleased({w:state.origin.width, h:state.origin.height});
    }
  });
  input.addEventListener('pointerup', function(){
    /* change 事件负责结束；键盘/触控不会触发 change 前的手动标记 */
  });
  return input;
}

/* ---------------- 弹窗 / 提示 ---------------- */
function showModal(html, modalClass){
  const body = el('#modalBody');
  body.className = 'modal' + (modalClass ? ' ' + modalClass : '');
  body.innerHTML = html;
  el('#modalBack').classList.add('show');
}
function closeModal(){
  if(paintSession && paintSession.cleanup) paintSession.cleanup();
  paintSession = null;
  el('#modalBack').classList.remove('show');
}
let toastTimer = null;
function toast(msg){
  const t = el('#toast');
  t.textContent = msg;
  t.style.display = 'block';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2600);
}

/* ---------------- 内置画板：笔画结束后自动回读并重新分层 ---------------- */
const PAINT_HISTORY_LIMIT = 50;
let paintSession = null;
function paintPointFromEvent(canvas, event){
  const rect = canvas.getBoundingClientRect();
  return {
    x:clamp((event.clientX-rect.left)*canvas.width/rect.width, 0, canvas.width-1),
    y:clamp((event.clientY-rect.top)*canvas.height/rect.height, 0, canvas.height-1)
  };
}
function paintConfigureContext(ctx, stroke){
  ctx.globalCompositeOperation = stroke.action === 'transparent' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = stroke.action === 'mask' ? stroke.color : '#ffffff';
  ctx.fillStyle = stroke.action === 'mask' ? stroke.color : '#ffffff';
  ctx.lineWidth = stroke.size;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
function paintCurrentMaskColor(){
  const id = state.processingMode === 'gray' ? state.gray.previewMaskId : el('#selectMask').value;
  const color = getSolderMaskColor(id);
  return 'rgb(' + color.r + ',' + color.g + ',' + color.b + ')';
}
function paintRestoreSegment(ctx, sourceCanvas, stroke, from, to){
  const radius = stroke.size * 0.5;
  ctx.save(); ctx.beginPath();
  if(from === to){
    ctx.arc(to.x, to.y, radius, 0, Math.PI*2);
  } else {
    const dx = to.x-from.x, dy = to.y-from.y, length = Math.hypot(dx, dy) || 1;
    const nx = -dy/length*radius, ny = dx/length*radius;
    ctx.arc(from.x, from.y, radius, 0, Math.PI*2);
    ctx.arc(to.x, to.y, radius, 0, Math.PI*2);
    ctx.moveTo(from.x+nx, from.y+ny); ctx.lineTo(to.x+nx, to.y+ny);
    ctx.lineTo(to.x-nx, to.y-ny); ctx.lineTo(from.x-nx, from.y-ny); ctx.closePath();
  }
  ctx.clip(); ctx.drawImage(sourceCanvas, 0, 0);
  ctx.restore();
}
function paintDrawSegment(ctx, stroke, from, to, sourceCanvas){
  if(stroke.action === 'restore') return paintRestoreSegment(ctx, sourceCanvas, stroke, from, to);
  ctx.save(); paintConfigureContext(ctx, stroke);
  if(from === to){ ctx.beginPath(); ctx.arc(to.x, to.y, stroke.size*0.5, 0, Math.PI*2); ctx.fill(); }
  else { ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke(); }
  ctx.restore();
}
function paintDrawStroke(ctx, stroke, sourceCanvas){
  if(!stroke || !stroke.points || !stroke.points.length) return;
  paintDrawSegment(ctx, stroke, stroke.points[0], stroke.points[0], sourceCanvas);
  for(let i=1; i<stroke.points.length; i++) paintDrawSegment(ctx, stroke, stroke.points[i-1], stroke.points[i], sourceCanvas);
}
function paintReplay(){
  const session = paintSession;
  if(!session) return;
  session.ctx.globalCompositeOperation = 'source-over';
  session.ctx.putImageData(session.base, 0, 0);
  for(const stroke of session.strokes) paintDrawStroke(session.ctx, stroke, session.sourceCanvas);
  paintApplyToProject();
}
function paintResetAllStrokes(){
  const session = paintSession;
  if(!session || (!session.strokes.length && !session.redo.length)) return;
  // 超过历史上限而折叠进 base 的笔画也要一并移除，恢复打开编辑器时的原图。
  session.base = session.initialImage; session.strokes = []; session.redo = [];
  session.ctx.globalCompositeOperation = 'source-over';
  session.ctx.putImageData(session.initialImage, 0, 0);
  paintApplyToProject(); paintRefreshControls();
}
function paintFoldOldestStroke(){
  const session = paintSession;
  const dropped = session && session.strokes.shift();
  if(!dropped) return;
  const canvas = document.createElement('canvas'); canvas.width = session.canvas.width; canvas.height = session.canvas.height;
  const ctx = canvas.getContext('2d'); ctx.putImageData(session.base, 0, 0); paintDrawStroke(ctx, dropped, session.sourceCanvas);
  session.base = ctx.getImageData(0, 0, canvas.width, canvas.height);
}
function replaceProjectOrigin(imageData, sourceCanvas){
  // 仅替换原图与相关缓存，分层参数、视图相机和灯条坐标保持不变。
  state.origin = imageData; state.originCanvas = sourceCanvas;
  state.fullResGeneration = -1; state._roCache = null;
  imageProcessor.cachedSource = null; imageProcessor.cachedParams = null; imageProcessor.cached = null;
  edgeSharpener.reset();
  syncPreviewImageMeta();
  updateProcess();
}
function paintApplyToProject(){
  const session = paintSession;
  if(!session) return;
  replaceProjectOrigin(session.ctx.getImageData(0, 0, session.canvas.width, session.canvas.height), session.canvas);
}
function paintRefreshControls(){
  const session = paintSession;
  if(!session) return;
  el('#paintBrush').classList.toggle('active', session.tool === 'brush');
  el('#paintEraser').classList.toggle('active', session.tool === 'eraser');
  el('#paintUndo').disabled = session.strokes.length === 0;
  // 首笔完成后两个历史操作保持同等可见状态；只有撤销产生的笔画才会实际重做。
  el('#paintRedo').disabled = session.strokes.length === 0 && session.redo.length === 0;
  el('#paintReset').disabled = session.strokes.length === 0 && session.redo.length === 0;
}
function syncPaintImageMeta(){
  const session = paintSession, meta = el('#paintImageMeta');
  if(!session || !meta) return;
  const pixels = new Intl.NumberFormat(document.documentElement.lang || currentLanguage).format(session.canvas.width * session.canvas.height);
  meta.textContent = t('previewImageMeta', { pixels, width:session.canvas.width, height:session.canvas.height, zoom:Math.round(session.zoom * 100) });
}
function fitPaintCanvas(){
  const session = paintSession, stage = el('#paintStage');
  if(!session || !stage) return;
  const fit = Math.min((stage.clientWidth-24)/session.canvas.width, (stage.clientHeight-24)/session.canvas.height, 1);
  const scale = Math.max(0.01, fit) * session.zoom;
  session.canvas.style.width = Math.max(1, Math.floor(session.canvas.width*scale)) + 'px';
  session.canvas.style.height = Math.max(1, Math.floor(session.canvas.height*scale)) + 'px';
  clampPaintPan();
  if(el('#paintSizeIndicator')?.classList.contains('show')) updatePaintSizeIndicator(null, false);
  syncPaintImageMeta();
}
function clampPaintPan(){
  const session = paintSession, stage = el('#paintStage');
  if(!session || !stage) return;
  // 画板不设平移边界：未放大时也能横向、纵向自由移动图片。
  session.canvas.style.transform = 'translate(' + session.pan.x + 'px,' + session.pan.y + 'px)';
}
function updatePaintSizeIndicator(point, keepVisible){
  const session = paintSession, stage = el('#paintStage'), indicator = el('#paintSizeIndicator');
  if(!session || !stage || !indicator) return;
  const canvasRect = session.canvas.getBoundingClientRect(), stageRect = stage.getBoundingClientRect();
  const diameter = Math.max(2, session.size * canvasRect.width / session.canvas.width);
  indicator.style.width = diameter + 'px'; indicator.style.height = diameter + 'px';
  // 粗细提示固定在画布中心，不随指针移动而遮挡待绘制区域。
  indicator.style.left = (canvasRect.left-stageRect.left + canvasRect.width*0.5-diameter*0.5) + 'px';
  indicator.style.top = (canvasRect.top-stageRect.top + canvasRect.height*0.5-diameter*0.5) + 'px';
  if(!keepVisible) return;
  indicator.classList.add('show');
  if(session.indicatorTimer) clearTimeout(session.indicatorTimer);
  session.indicatorTimer = setTimeout(() => { if(paintSession === session) indicator.classList.remove('show'); }, 850);
}
function zoomPaintCanvas(event){
  const session = paintSession, stage = el('#paintStage');
  if(!session || !stage) return;
  event.preventDefault();
  const point = paintPointFromEvent(session.canvas, event);
  const oldZoom = session.zoom, newZoom = clamp(oldZoom * Math.pow(1.12, -event.deltaY/120), 0.2, 8.0);
  if(Math.abs(newZoom-oldZoom) < 1e-6) return;
  session.zoom = newZoom; fitPaintCanvas();
  const nextRect = session.canvas.getBoundingClientRect();
  const targetX = nextRect.left + point.x/session.canvas.width*nextRect.width;
  const targetY = nextRect.top + point.y/session.canvas.height*nextRect.height;
  session.pan.x += event.clientX-targetX; session.pan.y += event.clientY-targetY;
  clampPaintPan(); updatePaintSizeIndicator(null, false);
}
function createPaintSourceCanvas(imageData){
  const canvas = document.createElement('canvas'); canvas.width = imageData.width; canvas.height = imageData.height;
  canvas.getContext('2d').putImageData(imageData, 0, 0);
  return canvas;
}
function cancelPaintEditor(){
  const session = paintSession;
  if(!session) return closeModal();
  // 画板会实时回读，所以取消时必须显式恢复打开画板前的原图。
  replaceProjectOrigin(session.initialImage, session.sourceCanvas);
  closeModal();
}
