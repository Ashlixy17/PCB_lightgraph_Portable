/* ---------------- 检查更新 ---------------- */
function parseVersionTag(tag){
  const match = String(tag || '').trim().match(/^v?(\d+)(?:\.(\d+))?(?:\.(\d+))?(?:[-+].*)?$/i);
  return match ? [Number(match[1]), Number(match[2] || 0), Number(match[3] || 0)] : null;
}
function compareVersionTags(current, latest){
  // 仅比较数字语义版本；latest 接口不会返回 GitHub 的草稿或预发布版本。
  const currentParts = parseVersionTag(current), latestParts = parseVersionTag(latest);
  if(!currentParts || !latestParts) return null;
  for(let i=0; i<currentParts.length; i++){
    if(latestParts[i] !== currentParts[i]) return latestParts[i] > currentParts[i] ? 1 : -1;
  }
  return 0;
}
function escapeHtml(text){
  // 远程版本标签会写入弹窗 HTML，先转义以避免把外部数据当作页面结构。
  return String(text).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
}
function showUpdateAvailableDialog(release){
  const latestTag = escapeHtml(release.tag_name || '');
  const releaseUrl = release.html_url || GITHUB_RELEASES_URL;
  showModal(
    '<h3>' + t('updateAvailableTitle') + '</h3>' +
    '<div class="mrow"><label>' + t('currentVersion') + '</label><span>' + APP_VERSION + '</span></div>' +
    '<div class="mrow"><label>' + t('latestVersion') + '</label><span>' + latestTag + '</span></div>' +
    '<div class="btns" style="justify-content:center"><button type="button" class="btn accent" id="btnOpenRelease">' + t('openRelease') + '</button></div>'
  );
  el('#btnOpenRelease').onclick = () => window.open(releaseUrl, '_blank', 'noopener');
}
async function checkForUpdates(){
  const button = el('#mCheckUpdates');
  if(button.disabled) return;
  button.disabled = true;
  button.textContent = t('checkingUpdates');
  try{
    // 应用可通过 file:// 直接打开，因此只请求公开、无需凭据的 GitHub API。
    const response = await fetch(GITHUB_LATEST_RELEASE_API, { cache:'no-store', headers:{ Accept:'application/vnd.github+json' } });
    if(response.status === 404){ toast(t('alreadyLatest')); return; }
    if(!response.ok) throw new Error('GitHub API: ' + response.status);
    const release = await response.json();
    const comparison = compareVersionTags(APP_VERSION, release.tag_name);
    if(comparison === null) throw new Error('Unsupported release tag: ' + release.tag_name);
    if(comparison > 0) showUpdateAvailableDialog(release);
    else toast(t('alreadyLatest'));
  }catch(error){
    console.warn('Update check failed:', error);
    toast(t('updateCheckFailed'));
  }finally{
    button.disabled = false;
    button.textContent = t('checkUpdates');
  }
}

/* ---------------- 导入图片 ---------------- */
const MAX_IMPORT_PIXELS = 16000000;
function scaleDownToPixelLimit(w, h, maxPixels){
  if(w <= 0 || h <= 0 || maxPixels <= 0) return {w:0,h:0};
  const srcPixels = w*h;
  if(srcPixels < maxPixels) return {w, h};
  const scale = Math.sqrt((maxPixels-1)/srcPixels);
  let nw = Math.max(1, Math.floor(w*scale));
  let nh = Math.max(1, Math.floor(h*scale));
  while(nw*nh >= maxPixels && (nw > 1 || nh > 1)){
    if(nw >= nh && nw > 1) --nw;
    else if(nh > 1) --nh;
    else break;
  }
  return {w:nw, h:nh};
}

function cropRectToSourceRect(rect, scale, nw, nh){
  // 起点向下取整、终点向上取整，确保用户框选到的边缘像素不会在映射时丢失。
  const left = clamp(Math.floor(rect.x/scale), 0, nw-1);
  const top = clamp(Math.floor(rect.y/scale), 0, nh-1);
  const right = clamp(Math.ceil((rect.x+rect.w)/scale), left+1, nw);
  const bottom = clamp(Math.ceil((rect.y+rect.h)/scale), top+1, nh);
  return { x:left, y:top, w:right-left, h:bottom-top };
}
function openCropDialog(img, onComplete){
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const maxW = Math.min(820, Math.max(280, window.innerWidth - 96));
  const maxH = Math.min(560, Math.max(220, window.innerHeight - 240));
  const scale = Math.min(maxW/nw, maxH/nh, 1);
  const cw = Math.max(1, Math.round(nw*scale)), ch = Math.max(1, Math.round(nh*scale));
  const minSize = Math.min(24, cw, ch), handleSize = 10;
  let crop = { x:0, y:0, w:cw, h:ch };
  let drag = null, panDrag = null, done = false;
  const cropView = { zoom:1, pan:{x:0,y:0} };

  showModal(
    '<div><h3>' + t('cropTitle') + '</h3>' +
    '<p class="crop-hint">' + t('cropHint') + '</p>' +
    '<div class="crop-stage" id="cropStage"><canvas id="cropCanvas" width="' + cw + '" height="' + ch + '"></canvas></div>' +
    '<div class="btns"><button type="button" class="btn drawing-action-btn" id="cropSkip">' + t('cropSkip') + '</button><button type="button" class="btn drawing-action-btn action-selected" id="cropConfirm">' + t('cropConfirm') + '</button></div></div>',
    'crop-modal'
  );
  const canvas = el('#cropCanvas'), ctx = canvas.getContext('2d'), stage = el('#cropStage'), back = el('#modalBack');

  function finish(rect){
    if(done) return;
    done = true;
    back.removeEventListener('click', onBackdropClick);
    window.removeEventListener('keydown', onKeyDown);
    closeModal();
    onComplete(cropRectToSourceRect(rect || { x:0, y:0, w:cw, h:ch }, scale, nw, nh));
  }
  function onBackdropClick(e){ if(e.target === back) finish(null); }
  function onKeyDown(e){ if(e.key === 'Escape') finish(null); }
  function draw(){
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, 0, 0, cw, ch);
    ctx.fillStyle = 'rgba(0,0,0,.58)';
    ctx.fillRect(0, 0, cw, crop.y);
    ctx.fillRect(0, crop.y, crop.x, crop.h);
    ctx.fillRect(crop.x+crop.w, crop.y, cw-(crop.x+crop.w), crop.h);
    ctx.fillRect(0, crop.y+crop.h, cw, ch-(crop.y+crop.h));
    ctx.strokeStyle = '#4cc2ff'; ctx.lineWidth = 2;
    ctx.strokeRect(crop.x, crop.y, crop.w, crop.h);
    ctx.fillStyle = '#4cc2ff';
    for(const point of [[crop.x,crop.y],[crop.x+crop.w,crop.y],[crop.x,crop.y+crop.h],[crop.x+crop.w,crop.y+crop.h]]){
      ctx.fillRect(point[0]-handleSize/2, point[1]-handleSize/2, handleSize, handleSize);
    }
  }
  function pointFromEvent(e){
    const r = canvas.getBoundingClientRect();
    return { x:(e.clientX-r.left)*cw/r.width, y:(e.clientY-r.top)*ch/r.height };
  }
  function applyCropTransform(){
    canvas.style.width = Math.max(1, Math.round(cw*cropView.zoom)) + 'px';
    canvas.style.height = Math.max(1, Math.round(ch*cropView.zoom)) + 'px';
    canvas.style.transform = 'translate(' + cropView.pan.x + 'px,' + cropView.pan.y + 'px)';
  }
  function zoomCropCanvas(e){
    e.preventDefault();
    const point = pointFromEvent(e);
    const nextZoom = clamp(cropView.zoom * Math.pow(1.12, -e.deltaY/120), 0.2, 8.0);
    if(Math.abs(nextZoom-cropView.zoom) < 1e-6) return;
    cropView.zoom = nextZoom; applyCropTransform();
    const r = canvas.getBoundingClientRect();
    cropView.pan.x += e.clientX-(r.left + point.x/cw*r.width);
    cropView.pan.y += e.clientY-(r.top + point.y/ch*r.height);
    applyCropTransform();
  }
  function hitTest(p){
    const x = crop.x, y = crop.y, right = x+crop.w, bottom = y+crop.h, near = handleSize;
    const close = (a,b) => Math.abs(a-b) <= near;
    if(close(p.x,x) && close(p.y,y)) return 'nw';
    if(close(p.x,right) && close(p.y,y)) return 'ne';
    if(close(p.x,x) && close(p.y,bottom)) return 'sw';
    if(close(p.x,right) && close(p.y,bottom)) return 'se';
    if(p.x >= x && p.x <= right && close(p.y,y)) return 'n';
    if(p.x >= x && p.x <= right && close(p.y,bottom)) return 's';
    if(p.y >= y && p.y <= bottom && close(p.x,x)) return 'w';
    if(p.y >= y && p.y <= bottom && close(p.x,right)) return 'e';
    if(p.x >= x && p.x <= right && p.y >= y && p.y <= bottom) return 'move';
    return null;
  }
  function cursorFor(hit){
    if(hit === 'move') return 'move';
    if(hit === 'n' || hit === 's') return 'ns-resize';
    if(hit === 'e' || hit === 'w') return 'ew-resize';
    if(hit === 'nw' || hit === 'se') return 'nwse-resize';
    if(hit === 'ne' || hit === 'sw') return 'nesw-resize';
    return 'default';
  }
  function resizeFromDrag(p){
    const dx = p.x-drag.startX, dy = p.y-drag.startY, start = drag.rect;
    let next = { ...start };
    if(drag.kind === 'move'){
      next.x = clamp(start.x+dx, 0, cw-start.w);
      next.y = clamp(start.y+dy, 0, ch-start.h);

    }
    const right = start.x+start.w, bottom = start.y+start.h;

    if(drag.kind.includes('n')){ next.y = clamp(start.y+dy, 0, bottom-minSize); next.h = bottom-next.y; }
    if(drag.kind.includes('s')) next.h = clamp(start.h+dy, minSize, ch-start.y);

  }

  canvas.addEventListener('pointerdown', function(e){
    if(e.button === 2){
      panDrag = { pointerId:e.pointerId, x:e.clientX, y:e.clientY, target:canvas };
      canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; e.preventDefault(); return;
    }
    if(e.button !== 0) return;
    const p = pointFromEvent(e), kind = hitTest(p);
    if(!kind) return;
    drag = { kind, startX:p.x, startY:p.y, rect:{ ...crop } };
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = cursorFor(kind);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function(e){
    if(panDrag && panDrag.target === canvas && panDrag.pointerId === e.pointerId){
      cropView.pan.x += e.clientX-panDrag.x; cropView.pan.y += e.clientY-panDrag.y;
      panDrag.x = e.clientX; panDrag.y = e.clientY;
      applyCropTransform(); e.preventDefault(); return;
    }
    const p = pointFromEvent(e);
    if(!drag){ canvas.style.cursor = cursorFor(hitTest(p)); return; }
    crop = resizeFromDrag(p); draw(); e.preventDefault();
  });
  canvas.addEventListener('pointerup', function(e){
    if(panDrag && panDrag.target === canvas && panDrag.pointerId === e.pointerId){
      panDrag = null; canvas.style.cursor = cursorFor(hitTest(pointFromEvent(e))); return;
    }
    if(drag){ drag = null; canvas.style.cursor = cursorFor(hitTest(pointFromEvent(e))); }
  });
  canvas.addEventListener('pointercancel', function(){ drag = null; panDrag = null; canvas.style.cursor = 'default'; });
  canvas.addEventListener('wheel', zoomCropCanvas, { passive:false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  // 裁剪画布外的黑色留白也可开始右键平移。
  stage.addEventListener('pointerdown', function(e){
    if(e.target !== stage || e.button !== 2) return;
    panDrag = { pointerId:e.pointerId, x:e.clientX, y:e.clientY, target:stage };
    stage.setPointerCapture(e.pointerId); stage.style.cursor = 'grabbing'; e.preventDefault();
  });
  stage.addEventListener('pointermove', function(e){
    if(!panDrag || panDrag.target !== stage || panDrag.pointerId !== e.pointerId) return;
    cropView.pan.x += e.clientX-panDrag.x; cropView.pan.y += e.clientY-panDrag.y;
    panDrag.x = e.clientX; panDrag.y = e.clientY;
    applyCropTransform(); e.preventDefault();
  });
  stage.addEventListener('pointerup', function(e){
    if(!panDrag || panDrag.target !== stage || panDrag.pointerId !== e.pointerId) return;
    try { stage.releasePointerCapture(e.pointerId); } catch(error) {}
    panDrag = null; stage.style.cursor = ''; e.preventDefault();
  });
  stage.addEventListener('pointercancel', function(){ if(panDrag?.target === stage){ panDrag = null; stage.style.cursor = ''; } });
  stage.addEventListener('contextmenu', e => e.preventDefault());
  back.addEventListener('click', onBackdropClick);
  window.addEventListener('keydown', onKeyDown);
  // 裁剪弹窗按钮在运行时创建，需要在插入弹窗后绑定悬停动画。
  attachFortniteHoverEffect(el('#cropSkip'));
  attachFortniteHoverEffect(el('#cropConfirm'));
  el('#cropSkip').onclick = () => finish(null);
  el('#cropConfirm').onclick = () => finish(crop);
  draw(); applyCropTransform();
}

function importDecodedImage(img, rect){
  // 裁切后的区域才参与像素上限计算，避免先缩小整图造成选区细节丢失。
  let maxPixels = MAX_IMPORT_PIXELS;
  let lim = scaleDownToPixelLimit(rect.w, rect.h, maxPixels);
  for(let attempt = 0; attempt < 8; attempt++){
    try {
      const c = document.createElement('canvas');
      c.width = lim.w; c.height = lim.h;
      const ctx = c.getContext('2d');
      if(!ctx) throw new Error(t('canvasContextFailed'));
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, lim.w, lim.h);
      state.origin = ctx.getImageData(0, 0, lim.w, lim.h);
      state.originCanvas = c;
      state.fullResGeneration = -1;
      state._roCache = null;
      imageProcessor.cachedSource = null; imageProcessor.cachedParams = null; imageProcessor.cached = null;
      edgeSharpener.reset();
      state.light.strips = [];
      state.light.pendingStart = null;
      setExportControlsEnabled(true);
      syncImportDrawingButton();
      syncPreviewImageMeta();
      updateProcess();
      return;
    } catch(err){
      const shrinkable = /array buffer|allocation|rangeerror/i.test(err.message);
      if(shrinkable && maxPixels > 500000){
        maxPixels = Math.floor(maxPixels / 2);
        lim = scaleDownToPixelLimit(rect.w, rect.h, maxPixels);
        continue;
      }
      toast(t('importFailed') + err.message);
      return;
    }
  }
  toast(t('imageTooLarge'));
}
function loadImageFile(file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function(){
    const w = img.naturalWidth, h = img.naturalHeight;
    if(!w || !h){ URL.revokeObjectURL(url); toast(t('invalidImageSize')); return; }
    URL.revokeObjectURL(url);
    openCropDialog(img, rect => importDecodedImage(img, rect));
  };
  img.onerror = function(){ URL.revokeObjectURL(url); toast(t('imageLoadFailed')); };
  img.src = url;
}

function blobToPng(blob){ return blob; }
function layerToPngBlob(layer, forceOpaqueMono){
  const w = layer.width, h = layer.height;

function decodeProjectImage(source){
  return new Promise((resolve, reject) => {
    const objectUrl = source instanceof Blob ? URL.createObjectURL(source) : null;
    const img = new Image();
    const cleanup = () => { if(objectUrl) URL.revokeObjectURL(objectUrl); };
    img.onload = () => {
      try {
        const width = img.naturalWidth, height = img.naturalHeight;
        if(!width || !height) throw new ProjectArchiveError('projectArchiveInvalid');
        const limited = scaleDownToPixelLimit(width, height, MAX_IMPORT_PIXELS);
        const canvas = document.createElement('canvas'); canvas.width = limited.w; canvas.height = limited.h;
        const context = canvas.getContext('2d'); context.imageSmoothingEnabled = true; context.imageSmoothingQuality = 'high';
        context.drawImage(img, 0, 0, limited.w, limited.h);
        const origin = context.getImageData(0, 0, limited.w, limited.h); cleanup(); resolve({origin, canvas});
      } catch(error){ cleanup(); reject(error); }
    };
    img.onerror = () => { cleanup(); reject(new ProjectArchiveError('projectArchiveInvalid')); };
    img.src = objectUrl || source;
  });
}
function applyImportedProject(project){
  // 图片和全部参数已在此之前完成校验，以下一次性替换当前工程状态。
  state.origin = project.image.origin; state.originCanvas = project.image.canvas;
  state.fullResGeneration = -1; state._roCache = null;
  imageProcessor.cachedSource = null; imageProcessor.cachedParams = null; imageProcessor.cached = null;
  edgeSharpener.reset();
  restoreControls(project.controls || {});
  applyExperimentalSettings(project.experimental);
  restoreLightStrips(project.ledStrips);
  setExportControlsEnabled(true); syncImportDrawingButton(); syncPreviewImageMeta(); updateProcess();
}
function archiveImageEntry(files, imageFileName){
  const requested = String(imageFileName || '').toLowerCase();
  if(requested && files.has(requested)){
    const requestedEntry = files.get(requested);
    if(PROJECT_ARCHIVE_IMAGE_EXTENSIONS.has(requestedEntry.name.split('.').pop().toLowerCase())) return requestedEntry;
  }
  for(const entry of files.values()){
    const extension = entry.name.split('.').pop().toLowerCase();
    if(PROJECT_ARCHIVE_IMAGE_EXTENSIONS.has(extension)) return entry;
  }
  throw new ProjectArchiveError('projectArchiveInvalid');
}
async function importNativeProjectFile(file){
  const files = await readProjectZip(new Uint8Array(await file.arrayBuffer()));
  const argsEntry = files.get('args.json');
  if(!argsEntry) throw new ProjectArchiveError('projectArchiveInvalid');
  let args;
  try { args = JSON.parse(new TextDecoder().decode(argsEntry.data)); } catch(error){ throw new ProjectArchiveError('projectArchiveInvalid'); }
  if(!args || typeof args !== 'object' || !args.controls || typeof args.controls !== 'object') throw new ProjectArchiveError('projectArchiveInvalid');
  const imageEntry = archiveImageEntry(files, args.imageFileName);
  const extension = imageEntry.name.split('.').pop().toLowerCase();
  const type = extension === 'jpg' ? 'image/jpeg' : `image/${extension}`;
  const image = await decodeProjectImage(new Blob([imageEntry.data], {type}));
  const portable = args.portable && typeof args.portable === 'object' ? args.portable : null;
  applyImportedProject({ image, controls:portable && portable.controls ? portable.controls : desktopControlsToPortable(args.controls),
    experimental:portable && portable.experimental ? portable.experimental : args.experimental, ledStrips:portable && Array.isArray(portable.ledStrips) ? portable.ledStrips : desktopStripsToPortable(args.ledStrips) });
}
async function importLegacyProjectFile(file){
  let root;
  try { root = JSON.parse(await file.text()); } catch(error){ throw new ProjectArchiveError('projectArchiveInvalid'); }
  if(!root || typeof root !== 'object' || !root.controls || typeof root.image !== 'string') throw new ProjectArchiveError('projectArchiveInvalid');
  const image = await decodeProjectImage(root.image);
  applyImportedProject({image, controls:root.controls, experimental:root.experimental, ledStrips:root.ledStrips});
}
async function importProjectFile(file){
  try {
    const header = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    const isArchive = file.name.toLowerCase().endsWith('.pcblg') || (header.length === 4 && header[0] === 0x50 && header[1] === 0x4b);
    if(isArchive) await importNativeProjectFile(file); else await importLegacyProjectFile(file);
    toast(t('projectImported'));
  } catch(error){
    toast(error instanceof ProjectArchiveError ? projectZipError(error) : t('projectParseFailed'));
  }
}

    '<div class="mrow"><label>' + t('sigma') + '</label><input type="number" id="dlgSigma" min="0.1" step="0.1" value="' + state.prefilter.sigma + '"></div>' +
    '<div class="btns"><button type="button" class="btn drawing-action-btn" id="dlgFilterCancel">' + t('cancel') + '</button><button type="button" class="btn drawing-action-btn action-selected" id="dlgFilterOk">' + t('confirm') + '</button></div>'
  );
  el('#dlgFilterOk').onclick = function(){
    state.prefilter.enabled = el('#dlgFilterOn').checked;

    closeModal(); updateProcess();
  };

  attachFortniteHoverEffect(el('#dlgFilterOk'));
}
function openDPDialog(){
  showModal(
    '<h3>' + t('dpTitle') + '</h3>' +

  el('#dlgDPCancel').onclick = closeModal;
  attachFortniteHoverEffect(el('#dlgDPCancel'));
  attachFortniteHoverEffect(el('#dlgDPOk'));
}
function colorRow(nameKey, key){
  return '<div class="mrow"><label>' + t(nameKey) + '</label><input type="color" id="col_' + key + '" value="' + toHex(custom[key]) + '"></div>';
}
function toHex(c){ return '#' + [c.r,c.g,c.b].map(v => v.toString(16).padStart(2,'0')).join(''); }
function openColorDialog(){
  showModal(
    '<h3>' + t('colorTitle') + '</h3>' +
    colorRow('colorEnig', 'enig') +
    colorRow('colorOsp', 'osp') +
    colorRow('colorHasl', 'hasl') +
    colorRow('colorBare', 'bare') +
    '<div class="btns"><button type="button" class="btn" id="dlgColorCancel">' + t('cancel') + '</button><button type="button" class="btn accent" id="dlgColorOk">' + t('confirm') + '</button></div>'
  );
  el('#dlgColorOk').onclick = function(){
    for(const k of ['enig','osp','hasl','bare']){
      const hex = el('#col_' + k).value;
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      if(!isNaN(r)){ custom[k] = {r,g,b}; }
    }
    saveLocalPrefs();
    closeModal();
    if(state.origin) updateProcess();
  };
  el('#dlgColorCancel').onclick = closeModal;
}
function resetAllSettings(){
  localStorage.removeItem('pcblg_scale');
  localStorage.removeItem('pcblg_prefs');
  localStorage.removeItem('pcblg_language');
  document.body.style.zoom = 1;
  custom.enig = {...DEFAULTS.enig}; custom.osp = {...DEFAULTS.osp}; custom.hasl = {...DEFAULTS.hasl}; custom.bare = {...DEFAULTS.bare};
  state.prefilter = { enabled:true, kernel:5, sigma:1.1 };
  state.dp = { enabled:false, tolerance:1.0, lineWidth:2 };
  state.light = { showOverlay:false, autoSense:1, radius:150, intensity:200, strips:[], pendingStart:null };
  state.gray = { ...GRAY_DEFAULTS };
  setGroupOpen('groupLight', false, true);
  el('#chkLightOverlay').checked = false;
  setSlider('#sliderLightSense', state.light.autoSense);
  setSlider('#sliderLightRadius', state.light.radius);
  setSlider('#sliderLightIntensity', state.light.intensity);
  setSlider('#sliderTrans', 120);
  setSlider('#sliderGraySilk', state.gray.silkThreshold);
  setSlider('#sliderGrayMask', state.gray.maskThreshold);
  setSlider('#sliderGrayThick', state.gray.thickRadius);
  setSlider('#sliderGrayBlur', state.gray.blurRadius);
  el('#grayPreviewMask').value = state.gray.previewMaskId;
  setProcessingMode('gray', false);
  if(state.origin) updateProcess();
  setLanguage('zh-CN', false);
  toast(t('resetSuccess'));
}

/* ---------------- 本地偏好 ---------------- */
function saveLocalPrefs(){
  localStorage.setItem('pcblg_prefs', JSON.stringify({ custom, prefilter:state.prefilter, dp:state.dp }));
}
function loadLocalPrefs(){
  setLanguage(localStorage.getItem('pcblg_language'), false);
  const s = localStorage.getItem('pcblg_scale');
  if(s) document.body.style.zoom = parseFloat(s) || 1;
  const p = localStorage.getItem('pcblg_prefs');
  if(p){
    try {
      const o = JSON.parse(p);
      if(o.custom){ for(const k of ['enig','osp','hasl','bare']) if(o.custom[k]) custom[k] = o.custom[k]; }
      if(o.prefilter) state.prefilter = o.prefilter;
      if(o.dp) state.dp = o.dp;
    } catch(e){}
  }
}

/* ---------------- 初始化 ---------------- */
function attachFortniteHoverEffect(button){
  let leaveTimer;
  button.addEventListener('pointerenter', function(){
    clearTimeout(leaveTimer);
    this.classList.remove('is-leaving');
    if(!this.disabled && !this.classList.contains('active')) this.classList.add('is-hovered');
  });
  button.addEventListener('pointerleave', function(){
    this.classList.remove('is-hovered');
    if(this.disabled || this.classList.contains('active')) return;
    this.classList.add('is-leaving');
    // 退出动画独立于 hover，指针越过描边边缘时也能完整播放。
    leaveTimer = setTimeout(() => this.classList.remove('is-leaving'), 150);
  });
}

  createSlider('sliderBareSim', 'bareSimilarity', 0, 100, 80);
  createSlider('sliderEdgeThresh', 'edgeThresholdMin', 0, 255, 50);
  createSlider('sliderEdgeThreshMax', 'edgeThresholdMax', 0, 255, 200);
  createSlider('sliderAutoInvert', 'autoInvertRange', -1, 50, 10);
  createSlider('sliderLightSense', 'autoLightSensitivity', 0, 10, state.light.autoSense, 1, v => { state.light.autoSense = v; });
  createSlider('sliderLightRadius', 'lightRadius', 20, 500, state.light.radius, 1, v => { state.light.radius = v; });

  createSlider('sliderGraySilk', 'graySilkThreshold', 0, 255, GRAY_DEFAULTS.silkThreshold, 1, v => { state.gray.silkThreshold = v; });
  createSlider('sliderGrayMask', 'grayMaskThreshold', 0, 255, GRAY_DEFAULTS.maskThreshold, 1, v => { state.gray.maskThreshold = v; });
  createSlider('sliderGrayThick', 'grayThick', 0, 12, GRAY_DEFAULTS.thickRadius, 0.2, v => { state.gray.thickRadius = v; });
  createSlider('sliderGrayBlur', 'grayBlur', 0, 8, GRAY_DEFAULTS.blurRadius, 0.1, v => { state.gray.blurRadius = v; });

  // 折叠组标题点击
  document.querySelectorAll('.group>.group-header').forEach(h => {
    h.addEventListener('click', function(){
      const g = h.parentElement;
      const open = !g.classList.contains('open');
      setGroupOpen(g.id, open, true);
      syncEdgeUI();

    });
  });

  // 主控件变更 → 全分辨率重渲
  el('#selectFinish').addEventListener('change', function(){ syncEdgeUI(); updateProcess(); });
  el('#selectMask').addEventListener('change', updateProcess);
  el('#radioBareGray').addEventListener('change', function(){ if(this.checked) updateProcess(); });
  el('#radioBareColor').addEventListener('change', function(){ if(this.checked) updateProcess(); });
  el('#radioEdgeStroke').addEventListener('change', function(){ if(this.checked) updateProcess(); });
  el('#radioEdgeEnhance').addEventListener('change', function(){ if(this.checked) updateProcess(); });
  el('#chkUseMetal').addEventListener('change', function(){ syncEdgeUI(); updateProcess(); });
  el('#chkExposeMetal').addEventListener('change', updateProcess);
  el('#chkLightOverlay').addEventListener('change', function(){ state.light.showOverlay = this.checked; updateProcess(); });
  el('#btnAutoLights').addEventListener('click', autoSuggestLights);
  el('#grayPreviewMask').addEventListener('change', function(){ state.gray.previewMaskId = this.value; updateProcess(); });
  document.querySelectorAll('[data-processing-mode]').forEach(btn => {
    attachFortniteHoverEffect(btn);
    btn.addEventListener('click', function(){ setProcessingMode(this.dataset.processingMode, true); });
  });
  attachFortniteHoverEffect(el('#btnStarProject'));
  document.querySelectorAll('.drawing-action-btn').forEach(attachFortniteHoverEffect);
  document.querySelectorAll('[data-view-mode]').forEach(btn => {
    btn.addEventListener('click', function(){ setViewMode(this.dataset.viewMode); });
  });

  // 预览交互
  attachPreviewInteraction('composite');
  attachPreviewInteraction('copper');
  attachPreviewInteraction('mask');
  attachPreviewInteraction('silk');
  attachPreviewInteraction('bottom');
  for(const key in quadPreviewCanvases) attachQuadPreviewInteraction(key);
  attachLightPlacement('#canvasComposite', false);

  // 文件输入
  const fi = document.createElement('input');
  fi.type = 'file'; fi.accept = 'image/*'; fi.id = 'fileInput'; fi.style.display = 'none';
  fi.addEventListener('change', function(){ if(this.files[0]) loadImageFile(this.files[0]); this.value = ''; });
  document.body.appendChild(fi);

  const pi = document.createElement('input');
  pi.type = 'file'; pi.accept = '.pcblg,.pcblg.json,.json'; pi.id = 'projInput'; pi.style.display = 'none';
  pi.addEventListener('change', function(){ if(this.files[0]) importProjectFile(this.files[0]); this.value = ''; });
  document.body.appendChild(pi);

  el('#modalBack').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

  setupMenus();
  loadLocalPrefs();
  setViewMode('overlay');
  syncEdgeUI();
  resizeCanvases();
  window.addEventListener('resize', resizeCanvases);
}

/* 全局错误提示：任何运行时错误都显示为 toast，避免“无声失败” */

window.addEventListener('unhandledrejection', function(e){ try{ toast(t('runtimeError') + ((e.reason && e.reason.message) || t('unknownError'))); }catch(_){} });

document.addEventListener('DOMContentLoaded', init);
