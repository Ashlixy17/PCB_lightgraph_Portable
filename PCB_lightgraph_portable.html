function showModal(html, modalClass){
  const body = el('#modalBody');
  body.className = 'modal' + (modalClass ? ' ' + modalClass : '');
  body.innerHTML = html;
  el('#modalBack').classList.add('show');
}
function closeModal(){ el('#modalBack').classList.remove('show'); }
let toastTimer = null;
function toast(msg){
  const t = el('#toast');
  t.textContent = msg;
  t.style.display = 'block';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2600);
}

/* ---------------- 检查更新 ---------------- */
function parseVersionTag(tag){
  const match = String(tag || '').trim().match(/^v?(\d+)(?:\.(\d+))?(?:\.(\d+))?(?:[-+].*)?$/i);
  return match ? [Number(match[1]), Number(match[2] || 0), Number(match[3] || 0)] : null;
}
function compareVersionTags(current, latest){
  // 仅比较数字语义版本；latest 接口不会返回 GitHub 的草稿或预发布版本。
  const currentParts = parseVersionTag(current), latestParts = parseVersionTag(latest);
  if(!currentParts || !latestParts) return null;
  for(let i=0; i<currentParts.length; i++){
    if(latestParts[i] !== currentParts[i]) return latestParts[i] > currentParts[i] ? 1 : -1;
  }
  return 0;
}
function escapeHtml(text){
  // 远程版本标签会写入弹窗 HTML，先转义以避免把外部数据当作页面结构。
  return String(text).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
}
function showUpdateAvailableDialog(release){
  const latestTag = escapeHtml(release.tag_name || '');
  const releaseUrl = release.html_url || GITHUB_RELEASES_URL;
  showModal(
    '<h3>' + t('updateAvailableTitle') + '</h3>' +
    '<div class="mrow"><label>' + t('currentVersion') + '</label><span>' + APP_VERSION + '</span></div>' +
    '<div class="mrow"><label>' + t('latestVersion') + '</label><span>' + latestTag + '</span></div>' +
    '<div class="btns" style="justify-content:center"><button type="button" class="btn accent" id="btnOpenRelease">' + t('openRelease') + '</button></div>'
  );
  el('#btnOpenRelease').onclick = () => window.open(releaseUrl, '_blank', 'noopener');
}
async function checkForUpdates(){
  const button = el('#mCheckUpdates');
  if(button.disabled) return;
  button.disabled = true;
  button.textContent = t('checkingUpdates');
  try{
    // 应用可通过 file:// 直接打开，因此只请求公开、无需凭据的 GitHub API。
    const response = await fetch(GITHUB_LATEST_RELEASE_API, { cache:'no-store', headers:{ Accept:'application/vnd.github+json' } });
    if(response.status === 404){ toast(t('alreadyLatest')); return; }
    if(!response.ok) throw new Error('GitHub API: ' + response.status);
    const release = await response.json();
    const comparison = compareVersionTags(APP_VERSION, release.tag_name);
    if(comparison === null) throw new Error('Unsupported release tag: ' + release.tag_name);
    if(comparison > 0) showUpdateAvailableDialog(release);
    else toast(t('alreadyLatest'));
  }catch(error){
    console.warn('Update check failed:', error);
    toast(t('updateCheckFailed'));
  }finally{
    button.disabled = false;
    button.textContent = t('checkUpdates');
  }
}

/* ---------------- 导入图片 ---------------- */
const MAX_IMPORT_PIXELS = 16000000;
function scaleDownToPixelLimit(w, h, maxPixels){
  if(w <= 0 || h <= 0 || maxPixels <= 0) return {w:0,h:0};
  const srcPixels = w*h;
  if(srcPixels < maxPixels) return {w, h};
  const scale = Math.sqrt((maxPixels-1)/srcPixels);
  let nw = Math.max(1, Math.floor(w*scale));
  let nh = Math.max(1, Math.floor(h*scale));
  while(nw*nh >= maxPixels && (nw > 1 || nh > 1)){
    if(nw >= nh && nw > 1) --nw;
    else if(nh > 1) --nh;
    else break;
  }
  return {w:nw, h:nh};
}

function cropRectToSourceRect(rect, scale, nw, nh){
  // 起点向下取整、终点向上取整，确保用户框选到的边缘像素不会在映射时丢失。
  const left = clamp(Math.floor(rect.x/scale), 0, nw-1);
  const top = clamp(Math.floor(rect.y/scale), 0, nh-1);
  const right = clamp(Math.ceil((rect.x+rect.w)/scale), left+1, nw);
  const bottom = clamp(Math.ceil((rect.y+rect.h)/scale), top+1, nh);
  return { x:left, y:top, w:right-left, h:bottom-top };
}
function openCropDialog(img, onComplete){
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const maxW = Math.min(820, Math.max(280, window.innerWidth - 96));
  const maxH = Math.min(560, Math.max(220, window.innerHeight - 240));
  const scale = Math.min(maxW/nw, maxH/nh, 1);
  const cw = Math.max(1, Math.round(nw*scale)), ch = Math.max(1, Math.round(nh*scale));
  const minSize = Math.min(24, cw, ch), handleSize = 10;
  let crop = { x:0, y:0, w:cw, h:ch };
  let drag = null, done = false;

  showModal(
    '<div><h3>' + t('cropTitle') + '</h3>' +
    '<p class="crop-hint">' + t('cropHint') + '</p>' +
    '<div class="crop-stage"><canvas id="cropCanvas" width="' + cw + '" height="' + ch + '"></canvas></div>' +
    '<div class="btns"><button type="button" class="btn" id="cropSkip">' + t('cropSkip') + '</button><button type="button" class="btn accent" id="cropConfirm">' + t('cropConfirm') + '</button></div></div>',
    'crop-modal'
  );
  const canvas = el('#cropCanvas'), ctx = canvas.getContext('2d'), back = el('#modalBack');

  function finish(rect){
    if(done) return;
    done = true;
    back.removeEventListener('click', onBackdropClick);
    window.removeEventListener('keydown', onKeyDown);
    closeModal();
    onComplete(cropRectToSourceRect(rect || { x:0, y:0, w:cw, h:ch }, scale, nw, nh));
  }
  function onBackdropClick(e){ if(e.target === back) finish(null); }
  function onKeyDown(e){ if(e.key === 'Escape') finish(null); }
  function draw(){
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, 0, 0, cw, ch);
    ctx.fillStyle = 'rgba(0,0,0,.58)';
    ctx.fillRect(0, 0, cw, crop.y);
    ctx.fillRect(0, crop.y, crop.x, crop.h);
    ctx.fillRect(crop.x+crop.w, crop.y, cw-(crop.x+crop.w), crop.h);
    ctx.fillRect(0, crop.y+crop.h, cw, ch-(crop.y+crop.h));
    ctx.strokeStyle = '#4cc2ff'; ctx.lineWidth = 2;
    ctx.strokeRect(crop.x, crop.y, crop.w, crop.h);
    ctx.fillStyle = '#4cc2ff';
    for(const point of [[crop.x,crop.y],[crop.x+crop.w,crop.y],[crop.x,crop.y+crop.h],[crop.x+crop.w,crop.y+crop.h]]){
      ctx.fillRect(point[0]-handleSize/2, point[1]-handleSize/2, handleSize, handleSize);
    }
  }
  function pointFromEvent(e){
    const r = canvas.getBoundingClientRect();
    return { x:(e.clientX-r.left)*cw/r.width, y:(e.clientY-r.top)*ch/r.height };
  }
  function hitTest(p){
    const x = crop.x, y = crop.y, right = x+crop.w, bottom = y+crop.h, near = handleSize;
    const close = (a,b) => Math.abs(a-b) <= near;
    if(close(p.x,x) && close(p.y,y)) return 'nw';
    if(close(p.x,right) && close(p.y,y)) return 'ne';
    if(close(p.x,x) && close(p.y,bottom)) return 'sw';
    if(close(p.x,right) && close(p.y,bottom)) return 'se';
    if(p.x >= x && p.x <= right && close(p.y,y)) return 'n';
    if(p.x >= x && p.x <= right && close(p.y,bottom)) return 's';
    if(p.y >= y && p.y <= bottom && close(p.x,x)) return 'w';
    if(p.y >= y && p.y <= bottom && close(p.x,right)) return 'e';
    if(p.x >= x && p.x <= right && p.y >= y && p.y <= bottom) return 'move';
    return null;
  }
  function cursorFor(hit){
    if(hit === 'move') return 'move';
    if(hit === 'n' || hit === 's') return 'ns-resize';
    if(hit === 'e' || hit === 'w') return 'ew-resize';
    if(hit === 'nw' || hit === 'se') return 'nwse-resize';
    if(hit === 'ne' || hit === 'sw') return 'nesw-resize';
    return 'default';
  }
  function resizeFromDrag(p){
    const dx = p.x-drag.startX, dy = p.y-drag.startY, start = drag.rect;
    let next = { ...start };
    if(drag.kind === 'move'){
      next.x = clamp(start.x+dx, 0, cw-start.w);
      next.y = clamp(start.y+dy, 0, ch-start.h);
      return next;
    }
    const right = start.x+start.w, bottom = start.y+start.h;
    if(drag.kind.includes('w')){ next.x = clamp(start.x+dx, 0, right-minSize); next.w = right-next.x; }
    if(drag.kind.includes('e')) next.w = clamp(start.w+dx, minSize, cw-start.x);
    if(drag.kind.includes('n')){ next.y = clamp(start.y+dy, 0, bottom-minSize); next.h = bottom-next.y; }
    if(drag.kind.includes('s')) next.h = clamp(start.h+dy, minSize, ch-start.y);
    return next;
  }

  canvas.addEventListener('pointerdown', function(e){
    const p = pointFromEvent(e), kind = hitTest(p);
    if(!kind) return;
    drag = { kind, startX:p.x, startY:p.y, rect:{ ...crop } };
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = cursorFor(kind);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function(e){
    const p = pointFromEvent(e);
    if(!drag){ canvas.style.cursor = cursorFor(hitTest(p)); return; }
    crop = resizeFromDrag(p); draw(); e.preventDefault();
  });
  canvas.addEventListener('pointerup', function(e){
    if(drag){ drag = null; canvas.style.cursor = cursorFor(hitTest(pointFromEvent(e))); }
  });
  canvas.addEventListener('pointercancel', function(){ drag = null; canvas.style.cursor = 'default'; });
  back.addEventListener('click', onBackdropClick);
  window.addEventListener('keydown', onKeyDown);
  el('#cropSkip').onclick = () => finish(null);
  el('#cropConfirm').onclick = () => finish(crop);
  draw();
}

function importDecodedImage(img, rect){
  // 裁切后的区域才参与像素上限计算，避免先缩小整图造成选区细节丢失。
  let maxPixels = MAX_IMPORT_PIXELS;
  let lim = scaleDownToPixelLimit(rect.w, rect.h, maxPixels);
  for(let attempt = 0; attempt < 8; attempt++){
    try {
      const c = document.createElement('canvas');
      c.width = lim.w; c.height = lim.h;
      const ctx = c.getContext('2d');
      if(!ctx) throw new Error(t('canvasContextFailed'));
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, lim.w, lim.h);
      state.origin = ctx.getImageData(0, 0, lim.w, lim.h);
      state.originCanvas = c;
      state.fullResGeneration = -1;
      state._roCache = null;
      imageProcessor.cachedSource = null; imageProcessor.cachedParams = null; imageProcessor.cached = null;
      edgeSharpener.reset();
      state.light.strips = [];
      state.light.pendingStart = null;
      setExportControlsEnabled(true);
      updateProcess();
      return;
    } catch(err){
      const shrinkable = /array buffer|allocation|rangeerror/i.test(err.message);
      if(shrinkable && maxPixels > 500000){
        maxPixels = Math.floor(maxPixels / 2);
        lim = scaleDownToPixelLimit(rect.w, rect.h, maxPixels);
        continue;
      }
      toast(t('importFailed') + err.message);
      return;
    }
  }
  toast(t('imageTooLarge'));
}
function loadImageFile(file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function(){
    const w = img.naturalWidth, h = img.naturalHeight;
    if(!w || !h){ URL.revokeObjectURL(url); toast(t('invalidImageSize')); return; }
    URL.revokeObjectURL(url);
    openCropDialog(img, rect => importDecodedImage(img, rect));
  };
  img.onerror = function(){ URL.revokeObjectURL(url); toast(t('imageLoadFailed')); };
  img.src = url;
}

/* ---------------- 导出 ---------------- */
function blobToPng(blob){ return blob; }
function layerToPngBlob(layer, forceOpaqueMono){
  const w = layer.width, h = layer.height;
  const d = new Uint8ClampedArray(layer.data);
  if(forceOpaqueMono){
    for(let i = 0; i < d.length; i += 4){ const v = d[i] >= 128 ? 255 : 0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
    const setPx = function(x, y, v){ const i = (y*w + x)*4; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; };
    setPx(0, 0, 255);
    if(h > 1) setPx(0, 1, 0);
    if(w > 1) setPx(1, 0, 0);
    if(w > 1 && h > 1){ setPx(w-1, h-1, 255); setPx(w-1, h-2, 0); setPx(w-2, h-1, 0); }
  }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').putImageData(new ImageData(d, w, h), 0, 0);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.target = '_blank';   // 防止 file:// 下下载被忽略时页面导航到自身
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

}
async function downloadLayerExport(key, settings){
  if(!state.layers || !state.layers[key]) return false;

  downloadBlob(blob, settings.grayscale ? settings.grayNames[key] : key + '_' + settings.finishName + '_Inverted.png');

    image: state.originCanvas.toDataURL('image/png'),

  const blob = new Blob([JSON.stringify(root)], { type:'application/json' });

function restoreControls(c){
  const setIdx = (sel, i) => { const e = el(sel); if(i >= 0 && i < e.options.length) e.selectedIndex = i; };
  setIdx('#selectFinish', c.surfaceFinishIndex || 0);

  state.light.radius = clamp(Number.isFinite(light.radius) ? light.radius : 150, 20, 500);
  state.light.intensity = clamp(Number.isFinite(light.intensity) ? light.intensity : 200, 0, 255);
  state.light.pendingStart = null;

  setSlider('#sliderBareA', c.bareSubstrateGrayA || 0);
  setSlider('#sliderBareB', c.bareSubstrateGrayB || 0);
  setSlider('#sliderBareSim', c.bareSubstrateColorSimilarity || 0);
  setGroupOpen('groupEdge', !!c.edgeEnable, true);

  el('#radioEdgeStroke').checked = stroke; el('#radioEdgeEnhance').checked = !stroke;
  setSlider('#sliderEdgeThresh', c.edgeThreshMin || 0);
  setSlider('#sliderEdgeThreshMax', c.edgeThreshMax || 0);
  setSlider('#sliderAutoInvert', c.autoInvert || 0);
  el('#chkUseMetal').checked = !!c.useMetalEdge;
  el('#chkExposeMetal').checked = c.exposeMetalEdge !== false;
  const gray = c.gray || {};
  state.gray.silkThreshold = clamp(Number.isFinite(gray.silkThreshold) ? gray.silkThreshold : GRAY_DEFAULTS.silkThreshold, 0, 255);
  state.gray.maskThreshold = clamp(Number.isFinite(gray.maskThreshold) ? gray.maskThreshold : GRAY_DEFAULTS.maskThreshold, 0, 255);
  state.gray.thickRadius = clamp(Number.isFinite(gray.thickRadius) ? gray.thickRadius : GRAY_DEFAULTS.thickRadius, 0, 12);
  state.gray.blurRadius = clamp(Number.isFinite(gray.blurRadius) ? gray.blurRadius : GRAY_DEFAULTS.blurRadius, 0, 8);
  // 旧工程的自由颜色无法映射预设色，导入时回退到默认蓝色。
  state.gray.previewMaskId = MASK_COLOR_IDS.includes(gray.previewMaskId) ? gray.previewMaskId : GRAY_DEFAULTS.previewMaskId;
  setSlider('#sliderGraySilk', state.gray.silkThreshold);
  setSlider('#sliderGrayMask', state.gray.maskThreshold);
  setSlider('#sliderGrayThick', state.gray.thickRadius);
  setSlider('#sliderGrayBlur', state.gray.blurRadius);
  el('#grayPreviewMask').value = state.gray.previewMaskId;
  // 旧工程没有 mode 字段时保持原有彩色识别行为。
  setProcessingMode(c.processingMode, false);

function setSlider(sel, v){
  const e = el(sel);
  if(!e) return;
  const input = e.querySelector('input');
  if(!input) return;
  const lo = parseInt(input.min, 10), hi = parseInt(input.max, 10);
  input.value = clamp(v, lo, hi);
  const lab = input.parentElement.querySelector('.lab');
  if(lab) refreshSliderLabel(lab, input);
}
function restoreLightStrips(raw){
  state.light.strips = [];
  state.light.pendingStart = null;
  if(!state.origin || !Array.isArray(raw)) return;
  // 工程文件可被手动修改；缺失或非法分量回退到安全值后再参与渲染。
  const valid = (value, fallback) => Number.isFinite(value) ? value : fallback;
  for(const strip of raw){
    if(!strip || !strip.start || !strip.end || !strip.color) continue;
    state.light.strips.push({
      start:{ x:clamp(Math.round(valid(strip.start.x, 0)), 0, state.origin.width-1), y:clamp(Math.round(valid(strip.start.y, 0)), 0, state.origin.height-1) },
      end:{ x:clamp(Math.round(valid(strip.end.x, 0)), 0, state.origin.width-1), y:clamp(Math.round(valid(strip.end.y, 0)), 0, state.origin.height-1) },
      radius:clamp(Math.round(valid(strip.radius, state.light.radius)), 20, 500),
      color:{ r:clamp(Math.round(valid(strip.color.r, 255)), 0, 255), g:clamp(Math.round(valid(strip.color.g, 255)), 0, 255), b:clamp(Math.round(valid(strip.color.b, 255)), 0, 255) }
    });
  }
}
function importProjectFile(file){
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const root = JSON.parse(reader.result);
      const c = root.controls || {};
      restoreControls(c);
      const exp = root.experimental || {};
      state.prefilter.enabled = exp.edgePrefilterEnabled !== false;
      state.prefilter.kernel = clampOddKernelSize(exp.edgePrefilterKernelSize || 5);
      state.prefilter.sigma = Math.max(0.001, exp.edgePrefilterSigma || 1.1);
      state.dp.enabled = !!exp.dpEnabled;
      state.dp.tolerance = Math.max(0.001, exp.dpTolerance || 1.0);
      state.dp.lineWidth = clamp(exp.dpLineWidth || 2, 1, 50);
      const img = new Image();
      img.onload = function(){
        const w = img.naturalWidth, h = img.naturalHeight;
        const lim = scaleDownToPixelLimit(w, h, MAX_IMPORT_PIXELS);
        const cv = document.createElement('canvas'); cv.width = lim.w; cv.height = lim.h;
        const ctx = cv.getContext('2d');
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, lim.w, lim.h);
        state.origin = ctx.getImageData(0, 0, lim.w, lim.h);
        state.originCanvas = cv;
        state.fullResGeneration = -1; state._roCache = null;
        imageProcessor.cachedSource = null; imageProcessor.cachedParams = null; imageProcessor.cached = null;
        edgeSharpener.reset();
        restoreLightStrips(root.ledStrips);
        setExportControlsEnabled(true);
        updateProcess();
        toast(t('projectImported'));
      };
      img.src = root.image;
    } catch(e){
      toast(t('projectParseFailed'));
    }
  };
  reader.readAsText(file);
}

  });
  document.querySelectorAll('[data-view-mode]').forEach(btn => {
    btn.addEventListener('click', function(){ setViewMode(this.dataset.viewMode); });
  });

  // 预览交互
  attachPreviewInteraction('composite');
  attachPreviewInteraction('copper');
  attachPreviewInteraction('mask');
  attachPreviewInteraction('silk');
  for(const key in quadPreviewCanvases) attachQuadPreviewInteraction(key);
  attachLightPlacement('#canvasComposite', false);
  attachLightPlacement('#canvasQuadComposite', true);

  // 文件输入
  const fi = document.createElement('input');
  fi.type = 'file'; fi.accept = 'image/*'; fi.id = 'fileInput'; fi.style.display = 'none';
  fi.addEventListener('change', function(){ if(this.files[0]) loadImageFile(this.files[0]); this.value = ''; });
  document.body.appendChild(fi);

  const pi = document.createElement('input');
  pi.type = 'file'; pi.accept = '.pcblg.json,.json'; pi.id = 'projInput'; pi.style.display = 'none';
  pi.addEventListener('change', function(){ if(this.files[0]) importProjectFile(this.files[0]); this.value = ''; });
  document.body.appendChild(pi);

  el('#modalBack').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

  setupMenus();
  loadLocalPrefs();
  setViewMode('overlay');
  syncEdgeUI();
  resizeCanvases();
  window.addEventListener('resize', resizeCanvases);
}

/* 全局错误提示：任何运行时错误都显示为 toast，避免“无声失败” */
window.addEventListener('error', function(e){ try{ toast(t('runtimeError') + (e.message || t('unknownError'))); }catch(_){} });
window.addEventListener('unhandledrejection', function(e){ try{ toast(t('runtimeError') + ((e.reason && e.reason.message) || t('unknownError'))); }catch(_){} });

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
